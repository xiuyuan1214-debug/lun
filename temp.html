<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者服務中心</title>
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        .main-wrapper {
            width: 95%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        /* 紅線以上：奶黃底操場風格 */
        .runner-header {
            background-color: #ffe89b; 
            /* 操場跑道紋理設計 */
            background-image: 
                radial-gradient(circle at 50% 150%, transparent 60%, rgba(255,255,255,0.4) 61%, transparent 62%),
                radial-gradient(circle at 50% 150%, transparent 70%, rgba(255,255,255,0.4) 71%, transparent 72%),
                radial-gradient(rgba(0,0,0,0.02) 1px, transparent 0);
            background-size: 100% 100%, 100% 100%, 10px 10px;
            
            padding: 60px 30px 40px 30px;
            text-align: center;
            border-radius: 0 0 50px 50px;
            color: #5d4037;
        }

        h1 { font-size: 32px; margin: 0; letter-spacing: 2px; }
        .subtitle { font-size: 12px; letter-spacing: 4px; margin: 10px 0 30px 0; opacity: 0.8; }

        /* 標題區塊：恢復為圓角矩形，不使用對話框尾巴 */
        .highlight-box {
            background-color: #ffffff;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            color: #d4a017;
            margin-bottom: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .intro-desc {
            text-align: left;
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .intro-desc p { margin: 0 0 15px 0; }

        .service-time {
            font-size: 11px;
            color: rgba(93, 64, 55, 0.6);
            border-top: 1px solid rgba(93, 64, 55, 0.1);
            padding-top: 20px;
            text-align: left;
        }

        /* 紅線 */
        .red-divider {
            width: 100%;
            height: 4px;
            background-color: #ff5252;
            margin: 20px 0;
        }

        /* 下半部表單內容完全不動 */
        .form-content { padding: 0 25px 40px 25px; }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-weight: bold; margin-bottom: 8px; color: #5d4037; }
        .field input, .field select, .field textarea {
            width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 8px; box-sizing: border-box;
        }
        .captcha-row { display: flex; gap: 10px; align-items: center; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- 紅線以上 -->
    <div class="runner-header">
        <h1>跑者服務中心</h1>
        <div class="subtitle">RUNNER SERVICE CENTER</div>

        <div class="highlight-box">讓我們聽見您的腳步聲</div>

        <div class="intro-desc">
            <p>無論您是因為突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷 ☺️</p>
            <p>您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。</p>
            <p>讓我們一起朝更好的自己邁進，讓這份對跑步熱愛，連結起每一個熱血的靈魂。希望這裡不只是網站，更是跑者們的補給站。</p>
        </div>

        <div class="service-time">
            ＊ 服務時間：週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
        </div>
    </div>

    <!-- 紅線 -->
    <div class="red-divider"></div>

    <!-- 紅線以下 -->
    <div class="form-content">
        <div class="field">
            <label>姓名 / Name</label>
            <input type="text" placeholder="請輸入您的姓名">
        </div>
        <div class="field">
            <label>電子信箱 / E-mail</label>
            <input type="email" placeholder="runner@gmail.com">
        </div>
        <div class="field">
            <label>跑者屬性 / Runner Type</label>
            <select><option>請選擇 / Please Select</option></select>
        </div>
        <div class="field">
            <label>最佳成績 / Personal Best</label>
            <input type="text" placeholder="例如：全馬3:30:00">
        </div>
        <div class="field">
            <label>目標成績 / Target Goal</label>
            <input type="text" placeholder="例如：全馬2:59:59">
        </div>
        <div class="field">
            <label>您的問題 / Your Inquiry</label>
            <textarea rows="4" placeholder="每一滴汗水，都值得被聽見..."></textarea>
        </div>
        <div class="field">
            <label>驗證碼 / Verification Code</label>
            <div class="captcha-row">
                <input type="text" style="flex:2" placeholder="請輸入驗證碼">
                <div style="flex:1; background:#eee; height:40px; border-radius:5px; display:flex; align-items:center; justify-content:center; color:#999; font-style:italic;">B 2 W G</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
