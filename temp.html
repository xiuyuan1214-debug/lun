<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者服務中心</title>
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #fdfcfb;
            display: flex;
            justify-content: center;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        .main-wrapper {
            width: 95%;
            max-width: 450px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,0.05);
        }

        /* 奶黃底操場形狀設計 - 具象化跑道圓環 */
        .runner-header {
            position: relative;
            background-color: #ffe89b;
            padding: 60px 30px 60px 30px;
            text-align: center;
            color: #796151;
            /* 模擬操場 U 型跑道的彎道形狀 */
            border-bottom-left-radius: 50% 20%;
            border-bottom-right-radius: 50% 20%;
            box-shadow: inset 0 -10px 20px rgba(255, 255, 255, 0.4);
        }

        /* 操場分道線 */
        .runner-header::before {
            content: "";
            position: absolute;
            top: 20px; left: 15px; right: 15px; bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-bottom-left-radius: 180px;
            border-bottom-right-radius: 180px;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            pointer-events: none;
        }

        h1 { font-size: 28px; margin: 0; letter-spacing: 2px; position: relative; z-index: 1; }
        .subtitle { font-size: 11px; letter-spacing: 3px; margin: 8px 0 25px 0; opacity: 0.7; position: relative; z-index: 1; }

        .highlight-box {
            background-color: #ffffff;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            color: #a88d70;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
            z-index: 1;
        }

        .intro-desc {
            text-align: left;
            line-height: 1.8;
            font-size: 15px;
            position: relative;
            z-index: 1;
        }
        .intro-desc p { margin: 0 0 12px 0; }

        .service-time {
            font-size: 11px;
            color: rgba(121, 97, 81, 0.6);
            border-top: 1px solid rgba(121, 97, 81, 0.1);
            padding-top: 15px;
            margin-top: 20px;
            text-align: left;
            position: relative;
            z-index: 1;
        }

        /* 表單內容：嚴格遵守不動文字、顏色參考圖片 */
        .form-content { padding: 30px 25px; }
        .field { margin-bottom: 22px; }
        .field label { display: block; font-weight: bold; margin-bottom: 10px; color: #796151; font-size: 16px; }
        
        /* 表格框樣式 (參考 IMG_5520.png) */
        .field input, .field select, .field textarea {
            width: 100%; 
            padding: 14px; 
            border: 1.5px solid #eee9e4; 
            border-radius: 15px;         
            background-color: #faf9f6;   
            box-sizing: border-box; 
            font-size: 15px;
            color: #555;
            outline: none;
        }

        .captcha-group { display: flex; gap: 12px; align-items: center; }
        
        .captcha-display {
            flex: 1.2; 
            background: #f4f1ed; 
            height: 48px; 
            border-radius: 12px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            letter-spacing: 5px; 
            font-weight: bold; 
            font-size: 20px;
            color: #4e443f;
            user-select: none;
        }
        
        .refresh-btn { 
            font-size: 24px; 
            color: #a88d70; 
            cursor: pointer; 
            padding: 0 5px;
            transition: transform 0.2s;
        }
        .refresh-btn:active { transform: rotate(90deg); }

        /* 送出按鈕 (參考 IMG_5520.png) */
        .submit-btn {
            width: 100%; 
            padding: 16px; 
            background-color: #4e443f; 
            color: white;
            border: none; 
            border-radius: 15px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="runner-header">
        <h1>跑者服務中心</h1>
        <div class="subtitle">RUNNER SERVICE CENTER</div>
        <div class="highlight-box">讓我們聽見您的腳步聲</div>
        <div class="intro-desc">
            <p>無論您是因為突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷 ☺️</p>
            <p>您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。</p>
            <p>讓我們一起朝更好的自己邁進，讓這份對跑步熱愛，連結起每一個熱血的靈魂。希望這裡不只是網站，更是跑者們的補給站。</p>
        </div>
        <div class="service-time">
            ＊ 服務時間：週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
        </div>
    </div>

    <div class="form-content">
        <form onsubmit="return false;">
            <div class="field">
                <label>姓名 / Name</label>
                <input type="text" placeholder="請輸入您的姓名">
            </div>
            <div class="field">
                <label>電子信箱 / E-mail</label>
                <input type="email" placeholder="runner@gmail.com">
            </div>
            <div class="field">
                <label>跑者屬性 / Runner Type</label>
                <select>
                    <option value="" disabled selected>請選擇 / Please Select</option>
                    <option value="beginner">新手跑者 / Beginner</option>
                    <option value="half-marathon">半馬跑者 / Half Marathon Runner</option>
                    <option value="marathon">全馬跑者 / Full Marathon Runner</option>
                    <option value="ultra-trail">超馬/越野跑者 / Ultra & Trail Runner</option>
                </select>
            </div>
            <div class="field">
                <label>最佳成績 / Personal Best</label>
                <input type="text" placeholder="例如：全馬3:30:00">
            </div>
            <div class="field">
                <label>目標成績 / Target Goal</label>
                <input type="text" placeholder="例如：全馬2:59:59">
            </div>
            <div class="field">
                <label>穿戴配備 / Wearable Device</label>
                <input type="text" placeholder="例如：Garmin, Apple Watch, Coros">
            </div>
            <div class="field">
                <label>您的問題 / Your Inquiry</label>
                <textarea rows="4" placeholder="每一滴汗水，都值得被聽見..."></textarea>
            </div>
            
            <div class="field">
                <label>驗證碼 / Verification Code</label>
                <div class="captcha-group">
                    <input type="text" style="flex: 1;" placeholder="輸入碼">
                    <div class="captcha-display" id="captchaText">7 W 8 Q</div>
                    <span class="refresh-btn" onclick="refreshCaptcha()">↻</span>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">送出表單 / Submit Form</button>
        </form>
    </div>
</div>

<script>
    function refreshCaptcha() {
        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        let result = '';
        for (let i = 0; i < 4; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length)) + ' ';
        }
        document.getElementById('captchaText').innerText = result.trim();
    }
</script>

</body>
</html>
