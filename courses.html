<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - 跑者服務中心</title>
    <style>
        :root {
            --nav-bg: #333333;
            --bg-yellow: #FFFBEB;
            --text-main: #333333;
            --c-brown: #8B4513;
            --c-yellow: #FFD700;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            margin: 0; padding: 0; background-color: var(--bg-yellow);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 導覽列：透過 container 限制寬度，讓按鈕大小縮小並對齊 */
        .navbar {
            background-color: var(--nav-bg);
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }

        .nav-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 22px 0 16px 0;
        }
        
        .nav-item { 
            text-decoration: none; 
            text-align: center; 
            color: #ffffff; 
            flex: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }

        .nav-item span { 
            display: block; 
            font-size: 21px; 
            font-weight: bold; 
            line-height: 1.1;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .nav-item small { 
            display: block; 
            font-size: 11px; 
            text-transform: uppercase; 
            font-weight: 300; 
            opacity: 0.8;
            line-height: 1;
            white-space: nowrap;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 40px 25px; }

        h2 { text-align: center; margin-bottom: 30px; font-size: 28px; }

        /* 表單與底層內容：完整恢復 */
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, select, textarea { 
            width: 100%; padding: 12px; border: 1px solid #ccc; 
            border-radius: 8px; box-sizing: border-box; font-size: 16px;
        }

        .verify-box { display: flex; gap: 10px; align-items: center; }
        .verify-code { 
            background: #eee; padding: 10px 20px; border-radius: 5px; 
            font-weight: bold; letter-spacing: 3px; 
        }

        /* 圓點修正：上色且靠近文字 */
        .info-list { list-style: none; padding: 0; margin-top: 30px; }
        .info-list li { display: flex; align-items: flex-start; margin-bottom: 10px; }
        .info-list li::before { 
            content: "·"; color: var(--c-brown); font-weight: 900; 
            font-size: 24px; margin-right: 8px; line-height: 1; 
        }

        /* 頁尾修正：往上移一點 */
        .footer { padding: 10px 0 80px 0; text-align: center; }
        .footer-msg { color: #666; font-size: 15px; margin-bottom: 15px; }
        .submit-btn { 
            background-color: var(--nav-bg); color: white; border: none; 
            padding: 15px 80px; border-radius: 8px; font-size: 18px; 
            font-weight: bold; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-item"><span>教練資歷</span><small>COACH PROFILE</small></a>
            <a href="courses.html" class="nav-item"><span>課程簡介</span><small>COURSE</small></a>
            <a href="tools.html" class="nav-item"><span>配速工具</span><small>PACE TOOL</small></a>
            <a href="training.html" class="nav-item"><span>訓練日誌</span><small>TRAINING LOG</small></a>
            <a href="match.html" class="nav-item"><span>賽事日誌</span><small>RACE LOG</small></a>
        </div>
    </nav>

    <div class="container">
        <h2>預約諮詢表單</h2>
        <form id="contactForm">
            <div class="form-group">
                <label>姓名 / Name</label>
                <input type="text" placeholder="您的姓名" required>
            </div>
            <div class="form-group">
                <label>跑者屬性 / Runner Attribute</label>
                <select required>
                    <option value="">請選擇</option>
                    <option value="beginner">初階跑者 (Beginner)</option>
                    <option value="half">半馬跑者 (Half-marathon)</option>
                    <option value="full">全馬跑者 (Full-marathon)</option>
                    <option value="ultra">超馬/越野跑者 (Ultra/Trail)</option>
                </select>
            </div>
            <div class="form-group">
                <label>諮詢內容 / Message</label>
                <textarea rows="5" placeholder="請描述您的訓練需求或目標"></textarea>
            </div>
            <div class="form-group">
                <label>驗證碼 / Verification</label>
                <div class="verify-box">
                    <input type="text" placeholder="輸入驗證碼" style="flex: 2;">
                    <div class="verify-code">8X2Y</div>
                </div>
            </div>
            
            <ul class="info-list">
                <li>專業的跑步數據分析與建議。</li>
                <li>針對個人目標賽事提供客製化規劃方案。</li>
                <li>教練將於 48 小時內回覆您的諮詢請求。</li>
            </ul>

            <div class="footer">
                <p class="footer-msg">讓我們一起跑出健康快樂的
