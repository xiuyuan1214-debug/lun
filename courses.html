<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程簡介 - 跑者服務中心</title>
    <style>
        :root {
            --nav-bg: #333333;
            
            /* 顏色修正：調亮藍色與綠色，保持不鮮豔 */
            --bg-blue: #F5FAFD;  
            --c-blue: #7FB3D1;   
            
            --bg-green: #F7FAF8; 
            --c-green: #76A589;  
            
            /* 嚴格復原其餘顏色 */
            --bg-red: #FFF1F0;
            --c-orange: #D97E38; 
            --text-main: #333333;
            --text-list-t: #444444;
            --text-list-d: #666666;
            --text-card: #555555;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            margin: 0; padding: 0; background-color: #ffffff;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* 導覽列：復原自 IMG_5624.jpeg */
        .navbar {
            background-color: var(--nav-bg);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-item { text-decoration: none; text-align: center; color: #ffffff; min-width: 80px; }
        .nav-item span { display: block; font-size: 18px; font-weight: bold; margin-bottom: 2px; }
        .nav-item small { display: block; font-size: 10px; text-transform: uppercase; font-weight: 300; opacity: 0.8; }

        .block-wrapper { padding: 45px 0; text-align: center; }
        .online { background-color: var(--bg-blue); margin-top: 10px; }
        .private { background-color: var(--bg-red); }
        .group { background-color: var(--bg-green); }

        .container { max-width: 600px; margin: 0 auto; text-align: left; padding: 0 25px; }

        h2 { font-size: 24px; font-weight: 700; margin: 0 0 5px 0; color: var(--text-main); }
        .subtitle { font-size: 13px; font-weight: 900; margin: 0 0 25px 0; letter-spacing: 1px; text-transform: uppercase; }
        
        .online .subtitle { color: var(--c-blue); }
        .private .subtitle { color: var(--c-orange); }
        .group .subtitle { color: var(--c-green); }

        .card {
            background: #fff; padding: 22px 28px; border-radius: 10px;
            margin-bottom: 25px; border-left: 7px solid;
            line-height: 1.7; font-size: 16px;
            color: var(--text-card);
        }
        .card b { color: var(--text-main); font-weight: 900; }

        .online .card { border-left-color: var(--c-blue); }
