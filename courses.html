<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-red: #FFF1F0;
            --c-orange: #D97E38; 
            --text-dark: #333333;
            --text-desc: #888888;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            margin: 0; padding: 0; color: var(--text-dark); background: #fff;
        }

        /* 導覽列 */
        .navbar {
            background-color: #333;
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 25px;
        }
        .nav-item { text-decoration: none; text-align: center; color: #fff; }
        .nav-item span { display: block; font-size: 18px; font-weight: bold; margin-bottom: 2px; }
        .nav-item small { display: block; font-size: 10px; text-transform: uppercase; }

        /* 主區塊 (對標 IMG_5554_6.png) */
        .section { 
            padding: 80px 0 60px 0; 
            text-align: center; 
            background-color: var(--bg-red); 
        }
        
        h2 { font-size: 28px; font-weight: 600; margin: 0 0 12px 0; color: #333; }
        .subtitle { 
            font-size: 16px; 
            font-weight: 900; 
            margin: 0 0 45px 0; 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
            color: var(--c-orange); 
        }

        /* 核心價值白盒 */
        .card {
            background: #fff; 
            padding: 28px 32px; 
            border-radius: 12px; 
            max-width: 620px;
            margin: 0 auto 45px auto; 
            border-left: 8px solid var(--c-orange); 
            text-align: left;
            line-height: 1.8; 
            font-size: 17px;
        }

        /* 清單樣式：橘色圓點 + 橘色標題 + 灰色描述 */
        .list-wrap { display: inline-block; text-align: left; padding: 0 20px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { margin-bottom: 18px; font-size: 15px; display: flex; align-items: flex-start; }
        
        li::before { 
            content: "•"; 
            color: var(--c-orange); 
            margin-right: 10px; 
            font-weight: 900; 
            font-size: 24px; 
            line-height: 1; 
        }

        .list-title { color: var(--c-orange); font-weight: 800; }
        .list-desc { color: var(--text-desc); font-weight: 400; margin-left: 2px; }

        /* 頁尾復原：移除所有雜質，僅保留網址列風格 */
        .footer { 
            padding: 80px 0 0 0; 
            background-color: #fff; 
            text-align: center; 
        }

        .browser-bar {
            background: #F8F8F8;
            padding: 12px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: #333;
            border-top: 1px solid #eee;
        }
        .browser-bar::before { 
            content: "🔒"; 
            margin-right: 8px; 
            font-size: 14px; 
            opacity: 0.6; 
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-item"><span>教練資歷</span><small>COACH PROFILE</small></a>
        <a href="courses.html" class="nav-item"><span>課程簡介</span><small>COURSE</small></a>
        <a href="tools.html" class="nav-item"><span>配速工具</span><small>PACE TOOL</small></a>
        <a href="training.html" class="nav-item"><span>訓練日誌</span><small>TRAINING LOG</small></a>
        <a href="match.html" class="nav-item"><span>賽事日誌</span><small>RACE LOG</small></a>
    </nav>

    <div class="section">
        <h2>私人教學</h2>
        <p class="subtitle">ONE-ON-ONE COACHING</p>
        
        <div class="card">
            ☆ 核心價值：根據跑者的身體結構優化動力鏈，讓進步不再靠運氣，而是靠精準的科學數據實踐。
        </div>

        <div class="list-wrap">
            <ul>
                <li><span class="list-title">跑姿校正：</span><span class="list-desc">透過錄影分析與拆解，使肌肉記憶正確動作。</span></li>
                <li><span class="list-title">體感配速建立：</span><span class="list-desc">協助跑者建立對各心率區間的感知。</span></li>
                <li><span class="list-title">動態負荷調控：</span><span class="list-desc">根據疲勞程度，即時調整訓練強度。</span></li>
                <li><span class="list-title">跑者專項強化引導：</span><span class="list-desc">針對薄弱環節設計輔助訓練。</span></li>
            </ul>
        </div>
    </div>

    <div class="footer">
        <div class="browser-bar">
            xiuyuan1214-debug.github.io
        </div>
    </div>

</body>
</html>
