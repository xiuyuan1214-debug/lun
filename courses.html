<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程簡介 - 跑者服務中心</title>
    <style>
        :root {
            --nav-bg: #333333;
            
            /* 顏色修正：調高藍色與綠色的亮度，保持清爽不鮮豔 */
            --bg-blue: #F0F7FA;  /* 調亮藍色背景 */
            --c-blue: #66A3C2;   /* 調亮藍色文字 */
            
            --bg-green: #F2F9F5; /* 調亮綠色背景 */
            --c-green: #5A9E75;  /* 調亮綠色文字 */
            
            /* 維持不變的其他設定 */
            --bg-red: #FFF1F0;
            --c-orange: #D97E38; 
            --text-main: #333333;
            --text-list-t: #444444;
            --text-list-d: #666666;
            --text-card: #555555;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            margin: 0; padding: 0; background-color: #ffffff;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* 導覽列：維持 IMG_5624.jpeg 樣式 */
        .navbar {
            background-color: var(--nav-bg);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-item { text-decoration: none; text-align: center; color: #ffffff; min-width: 80px; }
        .nav-item span { display: block; font-size: 18px; font-weight: bold; margin-bottom: 2px; }
        .nav-item small { display: block; font-size: 10px; text-transform: uppercase; font-weight: 300; opacity: 0.8; }

        .block-wrapper { padding: 45px 0; text-align: center; }
        .online { background-color: var(--bg-blue); margin-top: 10px; }
        .private { background-color: var(--bg-red); }
        .group { background-color: var(--bg-green); }

        .container { max-width: 600px; margin: 0 auto; text-align: left; padding: 0 25px; }

        h2 { font-size: 24px; font-weight: 700; margin: 0 0 5px 0; color: var(--text-main); }
        .subtitle { font-size: 13px; font-weight: 900; margin: 0 0 25px 0; letter-spacing: 1px; text-transform: uppercase; }
        
        .online .subtitle { color: var(--c-blue); }
        .private .subtitle { color: var(--c-orange); }
        .group .subtitle { color: var(--c-green); }

        .card {
            background: #fff; padding: 22px 28px; border-radius: 10px;
            margin-bottom: 25px; border-left: 7px solid;
            line-height: 1.7; font-size: 16px;
            color: var(--text-card);
        }
        .card b { color: var(--text-main); font-weight: 900; }

        .online .card { border-left-color: var(--c-blue); }
        .private .card { border-left-color: var(--c-orange); }
        .group .card { border-left-color: var(--c-green); }

        ul { list-style: none; padding: 0; margin: 0; }
        li { margin-bottom: 14px; font-size: 15px; display: flex; align-items: flex-start; line-height: 1.5; }
        li::before { content: "•"; margin-right: 10px; font-weight: 900; font-size: 22px; line-height: 1; }

        .online li::before { color: var(--c-blue); }
        .private li::before { color: var(--c-orange); }
        .group li::before { color: var(--c-green); }

        .list-title { color: var(--text-list-t); font-weight: 800; }
        .list-desc { color: var(--text-list-d); font-weight: 400; } 

        .footer { padding: 40px 0 0 0; text-align: center; background: #fff; }
        .footer-msg { color: #888888; font-size: 14px; margin-bottom: 25px; }
        .btn {
            display: inline-block; background-color: var(--nav-bg); color: #ffffff !important;
            padding: 15px 75px; text-decoration: none; border-radius: 8px; 
            font-weight: bold; font-size: 16px; margin-bottom: 45px;
        }

        .browser-bar {
            background: #F8F8F8; padding: 12px 0; font-size: 16px; color: #333; border-top: 1px solid #eee;
            display: flex; justify-content: center; align-items: center;
        }
        .browser-bar::before { content: "🔒"; margin-right: 8px; font-size: 14px; opacity: 0.6; }
    </style>
</head>
