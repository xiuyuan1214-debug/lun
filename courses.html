<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程簡介 - 跑者服務中心</title>
    <style>
        :root {
            --nav-bg: #333333;
            --bg-blue: #F5FBFE;  
            --c-blue: #6A9AC4;   
            --bg-pink: #FFF5F8; 
            --c-pink: #D97E96;  
            --bg-green: #F5FAF7; 
            --c-green: #5E8C73;  
            --text-main: #333333;
            --text-card: #555555;
            --text-list: #666666;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            margin: 0; padding: 0; background-color: #ffffff;
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 導覽列：修正按鈕過大問題，強制縮小字體並符合寬度 */
        .navbar {
            background-color: var(--nav-bg);
            padding: 15px 0 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }
        
        .nav-item { 
            text-decoration: none; 
            text-align: center; 
            color: #ffffff; 
            flex: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
            padding: 0 2px;
        }

        .nav-item span { 
            display: block; 
            font-size: 16px; /* 縮小中文字體避免視覺過大 */
            font-weight: bold; 
            line-height: 1.2;
            white-space: nowrap;
        }

        .nav-item small { 
            display: block; 
            font-size: 9px; /* 縮小英文標籤 */
            text-transform: uppercase; 
            font-weight: 300; 
            opacity: 0.8;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* 內容區塊排版：嚴格還原 */
        .block-wrapper { padding: 40px 0; }
        .online { background-color: var(--bg-blue); margin-top: 5px; }
        .private { background-color: var(--bg-pink); }
        .group { background-color: var(--bg-green); }

        .container { max-width: 600px; margin: 0 auto; padding: 0 25px; }
        
        h2 { font-size: 24px; font-weight: 700; margin: 0 0 5px 0; text-align: center; }
        .subtitle { font-size: 13px; font-weight: 900; margin: 0 0 25px 0; text-transform: uppercase; text-align: center; }
        
        .online .subtitle { color: var(--c-blue); }
        .private .subtitle { color: var(--c-pink); }
        .group .subtitle { color: var(--c-green); }

        .card { background: #fff; padding: 22px 28px; border-radius: 10px; margin-bottom: 25px; border-left: 7px solid; font-size: 16px; color: var(--text-card); text-align: left; }
        .card .core-text { color: var(--text-main); font-weight: 900; }
        
        .online .card { border-left-color: var(--c-blue); }
        .private .card { border-left-color: var(--c-pink); }
        .group .card { border-left-color: var(--c-green); }

        ul { list-style: none; padding: 0; margin: 0; text-align: left; }
        li { margin-bottom: 14px; font-size: 15px; line-height: 1.5; color: var(--text-list); display: flex; align-items: flex-start; }
        
        /* 圓點修正：靠近文字並加上主題顏色 */
        li::before { 
            content: "·"; 
            margin-right: 5px; 
            font-weight: 900; 
            font-size: 24px; 
            line-height: 1; 
        }
        
        .online li::before { color: var(--c-blue); }
        .private li::before { color: var(--c-pink); }
        .group li::before { color: var(--c-green); }

        .bold-item { font-weight: bold; color: var(--text-main); }

        /* 頁尾修正：內容上移 */
        .footer { padding: 20px 0 80px 0; text-align: center; }
        .footer-msg { color: #888888; font-size: 14px; margin-bottom: 15px; }
        .btn { display: inline-block; background-color: #333333; color: #ffffff !important; padding: 15px 75px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
