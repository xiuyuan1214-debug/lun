<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教練資歷 - Runner Service Center</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background-color: #fff; color: #333; }
        
        /* 黑色導航欄 - 參考 IMG_5377_6.jpeg */
        .nav-header { background-color: #222; padding: 20px 0; text-align: center; }
        .nav-links a { color: #fff; text-decoration: none; margin: 0 10px; font-size: 14px; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* 個人簡介區域 */
        .profile-header { display: flex; align-items: center; gap: 20px; padding: 20px 0; border-bottom: 1px solid #eee; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #fcf6e3; }
        .name-box h1 { margin: 0; font-size: 24px; }
        .name-box p { color: #8b7355; font-size: 13px; margin: 5px 0; font-weight: bold; }

        /* PB 顯示區域 - 參考 IMG_5555_7.jpg */
        .section-title { font-size: 18px; font-weight: bold; margin: 30px 0 15px; border-left: 4px solid #fcf6e3; padding-left: 10px; }
        .pb-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .pb-time { font-size: 32px; color: #8b7355; font-weight: bold; text-align: right; }

        /* 經歷時間軸 */
        .timeline { list-style: none; padding: 0; }
        .timeline-item { display: flex; gap: 15px; margin-bottom: 15px; font-size: 13px; }
        .year { font-weight: bold; min-width: 40px; }
        .event { color: #555; }
        .event strong { color: #8b7355; }
    </style>
</head>
<body>
    <div class="nav-header">
        <div class="nav-links">
            <a href="index.html">教練資歷</a>
            <a href="courses.html">課程簡介</a>
            <a href="tools.html">配速工具</a>
            <a href="training.html">訓練日誌</a>
            <a href="match.html">賽事日誌</a>
        </div>
    </div>

    <div class="container">
        <div class="profile-header">
            <img src="coach-avatar.jpg" alt="古佳倫" class="avatar">
            <div class="name-box">
                <h1>古佳倫 <small style="color:#999; font-size: 14px;">KU CHIA LUN</small></h1>
                <p>隸屬台灣大哥大長跑協會贊助選手</p>
            </div>
        </div>

        <div class="section-title">全馬最佳表現 (PB)</div>
        <div class="pb-card">
            <div style="font-size: 14px; color: #666;">2026 麗晨臺中國際馬拉松</div>
            <div style="font-size: 12px; color: #999;">總排第五名 ∞ 國內第一名</div>
            <div class="pb-time">2:33:32</div>
        </div>

        <div class="section-title">跑步經歷</div>
        <ul class="timeline">
            <li class="timeline-item"><span class="year">2026</span><div class="event">南山人壽臺北國道馬拉松<br><strong>總排第二名 · 國內第一名 2:37:23</strong></div></li>
            <li class="timeline-item"><span class="year">2026</span><div class="event">麗晨臺中國際馬拉松<br><strong>總排第五名 · 國內第一名 2:33:32 (PB)</strong></div></li>
            <li class="timeline-item"><span class="year">2025</span><div class="event">嘉義雙潭馬拉松菁英賽<br><strong>全馬男子組 · 國內第二名 2:43:17</strong></div></li>
        </ul>
    </div>
</body>
</html>
