<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程簡介 - 跑者服務中心</title>
    <style>
        :root {
            /* 1. 指令：所有顏色調整 (調亮藍、綠色調，維持專業墨感) */
            --nav-bg: #333333;
            --bg-blue: #F0F7FA;  
            --c-blue: #6A9AC4;   
            --bg-red: #FFF1F0;
            --c-orange: #D97E38; 
            --bg-green: #F2F8F5; 
            --c-green: #5E8C73;  
            --text-main: #333333;
            --text-card: #555555;
            --text-list: #666666;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            margin: 0; padding: 0; background-color: #ffffff;
            color: var(--text-main);
        }

        /* 2. 指令：頁面最上層按鈕排版調整跟照片一樣位置及大小 */
        .navbar {
            background-color: var(--nav-bg);
            padding: 20px 0 15px 0; /* 依照照片比例增加上下襯距 */
            display: flex;
            justify-content: center;
            gap: 25px; /* 依照照片 (IMG_5779.jpeg) 調整按鈕間距 */
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-item { 
            text-decoration: none; 
            text-align: center; 
            color: #ffffff; 
            min-width: 90px; 
        }
        .nav-item span { 
            display: block; 
            font-size: 20px; /* 依照照片大小調整 */
            font-weight: bold; 
            margin-bottom: 2px; 
        }
        .nav-item small { 
            display: block; 
            font-size: 11px; /* 依照照片大小調整 */
            text-transform: uppercase; 
            font-weight: 300; 
            opacity: 0.9;
        }

        /* 3. 指令：線上課表、私人教學、企業包班區塊需要一行字的留白 */
        .block-wrapper { 
            padding: 24px 0; /* 使用 24px (約一行標準字高) 作為上下留白 */
            text-align: center; 
        }
        
        .online { background-color: var(--bg-blue); margin-top: 10px; }
        .private
