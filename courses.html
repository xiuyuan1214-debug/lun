<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程簡介 - 跑者服務中心</title>
    <style>
        :root {
            /* 1. 指令：所有顏色重新調整 (確保與設計稿一致的深邃感) */
            --nav-bg: #2d2d2d;
            --bg-blue: #f1f8fc;  
            --c-blue: #5d9ab2;   
            --bg-red: #fff5f4;
            --c-orange: #d17d3d; 
            --bg-green: #f4f9f6; 
            --c-green: #5a8a6f;  
            --text-main: #333333;
            --text-card: #555555;
            --text-list: #666666;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            margin: 0; padding: 0; background-color: #ffffff;
            color: var(--text-main);
        }

        /* 2. 指令：頁面最上層按鈕排版 (嚴格參照 IMG_5779.jpeg 的比例與位置) */
        .navbar {
            background-color: var(--nav-bg);
            padding: 22px 0 16px 0; /* 依照照片高度比例設定 */
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }
        .nav-item { 
            text-decoration: none; 
            text-align: center; 
            color: #ffffff; 
            flex: 1; /* 讓五個按鈕平分整個寬度，如同照片顯示 */
            max-width: 20%;
        }
        .nav-item span { 
            display: block; 
            font-size: 21px; /* 依照照片文字大小設定 */
            font-weight: 600; 
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .nav-item small { 
            display: block; 
            font-size: 11px; /* 確保英文小標與照片比例一致，不被切到 */
            text-transform: uppercase; 
            font-weight: 300; 
            opacity: 0.8;
            letter-spacing: 0.8px;
        }

        /* 3. 指令：線上課表、私人教學、企業包班區塊一行字留白 */
        .block-wrapper { 
            padding: 24px 0; /* 指令要求：上下各留出一行字的高度 */
            text-align: center; 
        }
        
        .online { background-color: var(--bg-blue); margin-top: 5px; }
        .private { background-color: var(--bg-red); }
        .group { background-color: var(--bg-green); }

        /* 其餘 HTML 結構對應的 CSS 嚴格維持不動 */
        .container { max-width: 600px; margin: 0 auto; text-align: left; padding: 0 25px; }
        h2 { font-size: 24px; font-weight: 700; margin: 0 0 5px 0; }
        .subtitle { font-size: 13px; font-weight: 900; margin: 0 0 25px 0; text-transform: uppercase; }
        .online .subtitle { color: var(--c-blue); }
        .private .subtitle { color: var(--c-orange); }
        .group .subtitle { color: var(--c-green); }
        .card { background: #fff; padding: 22px 28px; border-radius: 10px; margin-bottom: 25px; border-left: 7px solid; line-height: 1.7; font-size: 16px; color: var(--text-card); }
        .card b { color: var(--text-main); font-weight: 900; }
        .online .card { border-left-color: var(--c-blue); }
        .private .card { border-left-color: var(--c-orange); }
        .group .card { border-left-color: var(--c-green); }
        ul { list-style: none; padding: 0; margin: 0; }
        li { margin-bottom: 14px; font-size: 15px; display: flex; align-items: flex-start; line-height: 1.5; color: var(--text-list); }
        li::before { content: "•"; margin-right: 10px; font-weight: 900; font-size: 22px; line-height: 1; }
        .online li::before { color: var(--c-blue); }
        .private li::before { color: var(--c-orange); }
        .group li::before { color: var(--c-green); }
        .footer { padding: 40px 0 60px 0; text-align: center; }
        .footer-msg { color: #888888; font-size: 14px; margin-bottom: 25px; }
        .btn { display: inline-block; background-color: #333333; color: #ffffff !important; padding: 15px 75px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px;
