<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程簡介 - 跑者服務中心</title>
    <style>
        :root {
            /* 1. 指令：所有顏色重新調整 (參照 IMG_5733.jpg) */
            --nav-bg: #333333;
            --bg-blue: #F0F7FA;  
            --c-blue: #6A9AC4;   
            --bg-red: #FFF1F0;
            --c-orange: #D97E38; 
            --bg-green: #F2F8F5; 
            --c-green: #5E8C73;  
            --text-main: #333333;
            --text-card: #555555;
            --text-list: #666666;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            margin: 0; padding: 0; background-color: #ffffff;
            color: var(--text-main);
        }

        /* 2. 指令：最上層按鈕排版與照片一致 (參照 IMG_5779.jpeg) */
        .navbar {
            background-color: var(--nav-bg);
            padding: 20px 0 12px 0; /* 調整內距確保小標 COACH PROFILE 等完整顯示 */
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }
        .nav-item { 
            text-decoration: none; 
            text-align: center; 
            color: #ffffff; 
            flex: 1;
        }
        .nav-item span { 
            display: block; 
            font-size: 18px; /* 依照照片比例設定字體 */
            font-weight: bold; 
            margin-bottom: 2px;
            white-space: nowrap;
        }
        .nav-item small { 
            display: block; 
            font-size: 9px; /* 確保小標完整顯示，不被截斷 */
            text-transform: uppercase; 
            font-weight: 300; 
            opacity: 0.9;
            white-space: nowrap;
        }

        /* 3. 指令：線上課表、私人教學、企業包班區塊需要一行字的留白 */
        .block-wrapper { 
            padding: 24px 0; /* 留出一行字的高度間距 */
            text-align: center; 
        }
        
        .online { background-color: var(--bg-blue); }
        .private { background
