<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程簡介 - 跑者服務中心</title>
    <style>
        :root {
            --nav-bg: #333333;
            /* 修正配色：藍、粉、綠 */
            --bg-blue: #F0F7FA;  
            --c-blue: #6A9AC4;   
            --bg-pink: #FFF0F5; 
            --c-pink: #D97E96;  
            --bg-green: #F2F8F5; 
            --c-green: #5E8C73;  
            --text-main: #333333;
            --text-card: #555555;
            --text-list: #666666;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            margin: 0; padding: 0; background-color: #ffffff;
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 頂層導覽列：嚴格復刻補給站規格 */
        .navbar {
            background-color: var(--nav-bg);
            padding: 22px 0 16px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }
        .nav-item { 
            text-decoration: none; 
            text-align: center; 
            color: #ffffff; 
            flex: 1;
        }
        .nav-item span { 
            display: block; 
            font-size: 21px; 
            font-weight: bold; 
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .nav-item small { 
            display: block; 
            font-size: 11px; 
            text-transform: uppercase; 
            font-weight: 300; 
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        .block-wrapper { padding: 40px 0; text-align: center; }
        .online { background-color: var(--bg-blue); margin-top: 5px; }
        .private { background-color: var(--bg-pink); }
        .group { background-color: var(--bg-green); }

        .container { max-width: 600px; margin: 0 auto; text-align: left; padding: 0 25px; }
        h2 { font-size: 24px; font-weight: 700; margin: 0 0 5px 0; }
        .subtitle { font-size: 13px; font-weight: 900; margin: 0 0 25px 0; text-transform: uppercase; }
        
        .online .subtitle { color: var(--c-blue); }
        .private .subtitle { color: var(--c-pink); }
        .group .subtitle { color: var(--c-green); }

        .
