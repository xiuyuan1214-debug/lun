<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者能量補給站</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            background-color: #ffffff;
            color: #8D7353;
            line-height: 1.2; /* 6. 縮小行與行間高度 */
        }

        /* 2. 最上層按鈕導覽列 (比照照片樣式) */
        .nav-bar {
            background-color: #333;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px 0;
            text-align: center;
        }
        .nav-bar a {
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-bar .cn { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        .nav-bar .en { font-size: 11px; opacity: 0.9; margin-top: 4px; text-transform: uppercase; font-family: Arial, sans-serif; }

        .main-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 10px 20px;
        }

        .stadium-header {
            background-color: #FFF9E7;
            border: 1px solid #E6D5B8;
            border-radius: 250px; 
            padding: 30px 70px;  
            text-align: center;
            margin-bottom: 20px;
        }
        
        .title-main { font-size: 26px; font-weight: bold; margin: 0; }
        .title-sub-en { 
            font-size: 12px; 
            letter-spacing: 1px; 
            margin: 2px 0 8px 0; 
            color: #C5B08A; 
            text-transform: uppercase;
            white-space: nowrap; 
        }
        
        .highlight-box {
            background-color: #ffffff;
            color: #D28B52;
            padding: 6px 18px; 
            border-radius: 25px;
            display: inline-block;
            font-weight: bold;
            font-size: 16px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 5px; /* 1. 減少空白 */
            line-height: 1;
        }

        /* 1 & 4. 內容置中與縮減間距 */
        .description {
            font-size: 13px;
            text-align: center; 
            margin: 0 auto;
            color: #8D7353;
        }
        .description p { margin: 2px 0; }

        /* 3 & 4. 課程項目置中與去留白 */
        .course-item {
            margin: 4px 0; 
            text-align: center;
        }
        .course-title { font-weight: bold; font-size: 15px; display: block; }
        .course-en { font-size: 10px; color: #C5B08A; display: block; margin-top: -2px; }

        /* 5. 符號靠近文字 */
        .dot { margin-right: -1px; }

        .service-time {
            font-size: 10px;
            color: #C5B08A;
            margin-top: 8px; 
            line-height: 1.3;
        }

        .form-group { margin-bottom: 12px; }
        .form-label { font-weight: bold; font-size: 14px; margin-bottom: 4px; display: block; color: #8D7353; }
        
        .input-box {
            width: 100%;
            padding: 6px 12px; 
            border: 1px solid #F5EEDB;
            background-color: #F9F5EA; 
            border-radius: 10px;
            box-sizing: border-box;
            color: #333;
            font-size: 13px;
        }
        
        /* 僅問題輸入框高度增加 */
        .input-box-large {
            padding: 10px 14px;
            font-size: 14px;
        }

        .captcha-container {
            display: flex;
            align-items: center;
            gap: 8px; /* 維持合適距離 */
        }
        .captcha-input {
            width: 70px !important;
            padding: 6px 8px !important;
            text-align: center;
        }
        .captcha-display {
            background-color: #E8E8E8; 
            padding: 6px 10px; 
            border-radius: 6px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #333;
            font-size: 12px;
        }
        .refresh-btn {
            font-size: 18px;
            color: #8D7353;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: #4E4A46;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- 2. 最上層按鈕 -->
    <nav class="nav-bar">
        <a href="coach.html"><span class="cn">教練資歷</span><span class="en">COACH PROFILE</span></a>
        <a href="courses.html"><span class="cn">課程簡介</span><span class="en">COURSE</span></a>
        <a href="tools.html"><span class="cn">配速工具</span><span class="en">PACE TOOL</span></a>
        <a href="training.html"><span class="cn">訓練日誌</span><span class="en">TRAINING LOG</span></a>
        <a href="match.html"><span class="cn">賽事日誌</span><span class="en">RACE LOG</span></a>
    </nav>

    <div class="main-container">
        <div class="stadium-header">
            <h1 class="title-main">跑者能量補給站</h1>
            <p class="title-sub-en">RUNNERS ENERGY STATION</p>
            
            <div class="highlight-box">讓我們聽見您的腳步聲</div>
            
            <div class="description">
                <!-- 1 & 5. 調整文字位置與符號距離 -->
                <p><span class="dot">·</span>讓我們一起跑出健康快樂的每一步 ◡̈</p>
                <p><span class="dot">·</span>預約一份溫暖的諮詢</p>

                <!-- 3 & 4. 線上課表、私人教學、企業包班 置中且去留白 -->
                <div class="course-item">
                    <span class="course-title">線上課表</span>
                    <span class="course-en">Online Training Plan</span>
                </div>
                <div class="course-item">
                    <span class="course-title">私人教學</span>
                    <span class="course-en">One-on-One Coaching</span>
                </div>
                <div class="course-item">
                    <span class="course-title">企業包班</span>
                    <span class="course-en">Corporate Training</span>
                </div>
            </div>

            <div class="service-time">
                服務時間：週一至週五 09:00-18:00<br>
                （跑者不休息，但小編需要一些運動時間)
            </div>
        </div>

        <form>
            <div class="form-group">
                <label class="form-label">姓名 / Name</label>
                <input type="text" class="input-box" placeholder="請輸入您的姓名">
            </div>

            <div class="form-group">
                <label class="form-label">電子信箱 / E-mail</label>
                <input type="email" class="input-box" placeholder="runner@gmail.com">
            </div>

            <div class="form-group">
                <label class="form-label">您的問題 / Your Inquiry</label>
                <textarea class="input-box input-box-large" rows="4" placeholder="每一滴汗水，都值得被聽見..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">驗證碼 / Verification Code</label>
                <div class="captcha-container">
                    <input type="text" class="input-box captcha-input" placeholder="輸入碼">
                    <div class="captcha-display" id="captcha">C 2 L 2</div>
                    <button type="button" class="refresh-btn" onclick="refreshCaptcha()">↻</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">送出表單 / Submit Form</button>
        </form>
    </div>

    <script>
        function refreshCaptcha() {
            const codes = ['C 2 L 2', 'R 8 T 4', 'P 9 X 1', 'M 5 K 7', 'A 3 Q 6'];
            const display = document.getElementById('captcha');
            display.innerText = codes[Math.floor(Math.random() * codes.length)];
        }
    </script>

</body>
</html>
