<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程簡介 - 跑者服務中心</title>
    <style>
        :root {
            /* 1. 指令：所有顏色重新調整 (參照 IMG_5733.jpg) */
            --nav-bg: #333333;
            --bg-blue: #F0F7FA;  
            --c-blue: #6A9AC4;   
            --bg-red: #FFF1F0;
            --c-orange: #D97E38; 
            --bg-green: #F2F8F5; 
            --c-green: #5E8C73;  
            --text-main: #333333;
            --text-card: #555555;
            --text-list: #666666;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            margin: 0; padding: 0; background-color: #ffffff;
            color: var(--text-main);
        }

        /* 2. 指令：最上層按鈕排版與照片完全一樣 (參照 IMG_5779.jpeg) */
        .navbar {
            background-color: var(--nav-bg);
            padding: 22px 0 16px 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }
        .nav-item { 
            text-decoration: none; 
            text-align: center; 
            color: #ffffff; 
            flex: 1;
            max-width: 20%;
        }
        .nav-item span { 
            display: block; 
            font-size: 21px; 
            font-weight: bold; 
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .nav-item small { 
            display: block; 
            font-size: 11px; 
            text-transform: uppercase; 
            font-weight: 300; 
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        /* 3. 指令：區塊需要一行字的留白 */
        .block-wrapper { 
            padding: 24px 0; 
            text-align: center; 
        }
        
        .online { background-color: var(--bg-blue); margin-top: 5px; }
        .private { background-color: var(--bg-red); }
        .group { background-color: var(--bg-green); }

        .container { max-width: 600px; margin: 0 auto; text-align: left; padding: 0 25px; }
        h2 { font-size: 24px; font-weight: 700; margin: 0 0 5px 0; }
        .subtitle { font-size: 13px; font-weight: 900; margin: 0 0 25px 0; text-transform: uppercase; }
        .online .subtitle { color: var(--c-blue); }
        .private .subtitle { color: var(--c-orange); }
        .group .subtitle { color: var(--c-green); }
        .card { background: #fff; padding: 22px 28px; border-radius: 10px; margin-bottom: 25px; border-left: 7px solid; line-height: 1
