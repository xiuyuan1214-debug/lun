<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <title>課程簡介 - Runner Service Center</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background-color: #fff; color: #333; line-height: 1.5; }
        
        /* 黑色導航欄 - 完全對照 IMG_5377_4.jpeg */
        .header-nav { background-color: #222; padding: 25px 0 15px 0; text-align: center; }
        .nav-links { display: flex; justify-content: center; gap: 20px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 14px; font-weight: normal; }
        .nav-links a.active { font-weight: bold; }

        /* 內容容器樣式 - 對照 IMG_5554_3.png */
        .container { padding: 80px 20px; max-width: 600px; margin: 0 auto; text-align: center; background-color: #fcf6e333; }

        .main-title { font-size: 26px; font-weight: bold; color: #333; margin-bottom: 8px; letter-spacing: 2px; }
        .sub-title { font-size: 18px; font-weight: bold; color: #d47a3c; margin-bottom: 50px; letter-spacing: 1px; }

        /* 核心價值區塊 - 對照 IMG_5554_3.png */
        .highlight-box { 
            background: #fff; 
            border: 2px solid #d47a3c;
            border-left: 8px solid #d47a3c; 
            padding: 30px; 
            border-radius: 12px; 
            margin-bottom: 50px; 
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .highlight-box p { margin: 0; font-size: 16px; color: #444; line-height: 1.8; }

        /* 課程細項 - 對照 IMG_5554_3.png */
        .course-details { text-align: left; display: inline-block; width: 100%; max-width: 500px; }
        .detail-item { margin-bottom: 25px; font-size: 15px; color: #444; display: flex; align-items: flex-start; }
        .detail-item span { color: #d47a3c; margin-right: 12px; font-weight: bold; }
        .detail-item strong { color: #000; font-weight: bold; }

    </style>
</head>
<body>

    <!-- 黑色導航欄位 -->
    <div class="header-nav">
        <div class="nav-links">
            <a href="index.html">教練資歷</a>

            <a href="training.html">訓練日誌</a>

        <div class="course-details">
            <div class="detail-item"><span>•</span> <div><strong>跑姿校正</strong>：透過錄影分析與拆解，使肌肉記憶正確動作。</div></div>

            <div class="detail-item"><span>•</span> <div><strong>動態負荷調控</strong>：根據疲勞程度，即時調整訓練強度。</div></div>
            <div class="detail-item"><span>•</span> <div><strong>跑者專項強化引導</strong>：針對薄弱環節設計輔助訓練。</div></div>
        </div>
