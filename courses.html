<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程簡介 - 跑者服務中心</title>
    <style>
        :root {
            --nav-bg: #333333;
            --bg-blue: #F5FBFE;  
            --c-blue: #6A9AC4;   
            --bg-pink: #FFF5F8; 
            --c-pink: #D97E96;  
            --bg-green: #F5FAF7; 
            --c-green: #5E8C73;  
            --text-main: #333333;
            --text-card: #555555;
            --text-list: #666666;
        }

        body {
            font-family: -apple-system, "Noto Sans TC", sans-serif;
            margin: 0; padding: 0; background-color: #ffffff;
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 導覽列：嚴格執行單行對齊，與 form.html 視覺統一 */
        .navbar {
            background-color: var(--nav-bg);
            padding: 22px 0 16px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }
        
        .nav-item { 
            text-decoration: none; 
            text-align: center; 
            color: #ffffff; 
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }

        .nav-item span { 
            display: block; 
            font-size: 21px; 
            font-weight: bold; 
            line-height: 1.1;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
            white-space: nowrap; 
        }

        .nav-item small { 
            display: block; 
            font-size: 11px; 
            text-transform: uppercase; 
            font-weight: 300; 
            opacity: 0.8;
            letter-spacing: 0.5px;
            line-height: 1;
            white-space: nowrap;
        }

        /* 內容區塊排版：嚴格還原 */
        .block-wrapper { padding: 40px 0; }
        .online { background-color: var(--bg-blue); margin-top: 5px; }
        .private { background-color: var(--bg-pink); }
        .group { background-color: var(--bg-green); }

        .container { max-width: 600px; margin: 0 auto; padding: 0 25px; }
        
        h2 { font-size: 24px; font-weight: 700; margin: 0 0 5px 0; text-align: center; }
        .subtitle
