<!-- 下半部白色背景表單區塊 -->
<div style="background-color: #fff; padding: 40px 25px;">
    <div style="max-width: 400px; margin: 0 auto;">
        <form style="display: flex; flex-direction: column; gap: 20px; color: #333;">
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">姓名 / Name</label>
                <input type="text" placeholder="請輸入您的姓名" style="width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; background-color: #f9f9f9; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">電子信箱 / E-mail</label>
                <input type="email" placeholder="runner@gmail.com" style="width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; background-color: #f9f9f9; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">跑者屬性 / Runner Type</label>
                <select style="width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; background-color: #f9f9f9; box-sizing: border-box; color: #888;">
                    <option>請選擇 / Please Select</option>
                </select>
            </div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">最佳成績 / Personal Best</label>
                <input type="text" placeholder="例如：全馬3:30:00" style="width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; background-color: #f9f9f9; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">目標成績 / Target Goal</label>
                <input type="text" placeholder="例如：全馬2:59:59" style="width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; background-color: #f9f9f9; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">穿戴配備 / Wearable Device</label>
                <input type="text" placeholder="例如：Garmin, Apple Watch, Coros" style="width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; background-color: #f9f9f9; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">您的問題 / Your Inquiry</label>
                <textarea placeholder="每一滴汗水，都值得被聽見..." style="width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; background-color: #f9f9f9; box-sizing: border-box; height: 120px;"></textarea>
            </div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">驗證碼 / Verification Code</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" placeholder="輸入碼" style="width: 80px; padding: 10px; border: 1px solid #eee; border-radius: 10px; background-color: #f9f9f9;">
                    <div style="background-color: #f0f0f0; padding: 8px 15px; border-radius: 5px; font-family: monospace; letter-spacing: 3px; font-weight: bold;">7 W 8 Q</div>
                    <span style="font-size: 18px; cursor: pointer;">↻</span>
                </div>
            </div>

            <button type="submit" style="width: 100%; padding: 15px; background-color: #614e1a; color: white; border: none; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;">

    </div>
