<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者服務中心</title>
    <style>
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
        }

        .container {
            background-color: #feeaa1;
            width: 100%;
            max-width: 500px;
            border-radius: 120px 120px 30px 30px;
            padding: 60px 35px 50px 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            color: #6d4c41;
            position: relative; /* 為了對話框的尾巴 */
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-weight: bold;
        }

        /* 這是新的對話框樣式 */
        .dialog-bubble {
            background-color: #ffffff;
            color: #d4a373; /* 棕金色文字 */
            display: inline-block;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 50px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            position: relative; /* 為了對話框的尾巴 */
        }

        /* 對話框的小尾巴 */
        .dialog-bubble::after {
            content: "";
            position: absolute;
            bottom: -15px; /* 在下方 */
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 15px 0 15px; /* 寬、高、寬 */
            border-style: solid;
            border-color: #ffffff transparent transparent transparent; /* 上邊框白，其餘透明 */
        }

        .content {
            text-align: left;
            line-height: 1.8;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 40px;
        }

        .content p {
            margin: 0 0 25px 0;
        }

        .footer {
            font-size: 11px;
            color: rgba(109, 76, 65, 0.7);
            border-top: 1px solid rgba(109, 76, 65, 0.2);
            padding-top: 25px;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>跑者服務中心</h1>
    <div class="subtitle">RUNNER SERVICE CENTER</div>

    <!-- 這是修改後的區域 -->
    <div class="dialog-bubble">
        讓我們聽見您的腳步聲
    </div>

    <div class="content">
        <p>無論您是因為突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷。</p>
        <p>您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。</p>
        <p>讓我們一起朝更好的自己邁進，讓這份對跑步熱愛，連結起每一個熱血的靈魂。
            希望這裡不只是網站，更是跑者們的補給站：）</p>
    </div>

    <div class="footer">
        ＊ 服務時間：週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
    </div>
</div>

</body>
</html>
