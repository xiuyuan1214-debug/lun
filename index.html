<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者服務中心</title>
    <style>
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            padding: 20px;
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
        }

        .container {
            /* 基礎奶黃色底 */
            background-color: #ffe89b; 
            width: 100%;
            max-width: 500px;
            border-radius: 120px 120px 40px 40px;
            padding: 60px 30px 40px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            color: #5d4037;
            position: relative;
            overflow: hidden;
        }

        /* 操場跑道風格背景裝飾 */
        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                /* 跑道顆粒質感 */
                radial-gradient(rgba(0,0,0,0.03) 1px, transparent 0),
                /* 操場分道白線 (弧形設計) */
                radial-gradient(circle at 50% 120%, transparent 60%, rgba(255,255,255,0.4) 60.5%, rgba(255,255,255,0.4) 61.5%, transparent 62%),
                radial-gradient(circle at 50% 120%, transparent 70%, rgba(255,255,255,0.4) 70.5%, rgba(255,255,255,0.4) 71.5%, transparent 72%),
                radial-gradient(circle at 50% 120%, transparent 80%, rgba(255,255,255,0.4) 80.5%, rgba(255,255,255,0.4) 81.5%, transparent 82%);
            background-size: 8px 8px, 100% 100%, 100% 100%, 100% 100%;
            z-index: 0;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 5px;
            letter-spacing: 2px;
            color: #5d4037;
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* 對話框樣式 */
        .dialog-bubble {
            background-color: #ffffff;
            display: inline-block;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            color: #d4a017; /* 原始標題顏色 */
            margin-bottom: 45px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
        }

        /* 對話框小尾巴 */
        .dialog-bubble::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0 10px;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
        }

        .text-content {
            text-align: left;
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .text-content p {
            margin-bottom: 20px;
        }

        .footer-note {
            font-size: 11px;
            color: rgba(93, 64, 55, 0.6);
            border-top: 1px solid rgba(93, 64, 55, 0.1);
            padding-top: 20px;
            text-align: left;
        }

        /* 紅線 (完全保留，位置精確) */
        .red-line {
            width: 100%;
            height: 4px;
            background-color: #ff5252;
            margin-top: 30px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div style="width: 100%; max-width: 500px;">
    <div class="container">
        <div class="content-wrapper">
            <h1>跑者服務中心</h1>
            <div class="subtitle">RUNNER SERVICE CENTER</div>

            <!-- 對話框設計 -->
            <div class="dialog-bubble">
                讓我們聽見您的腳步聲
            </div>

            <div class="text-content">
                <p>無論您是因為突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷。</p>
                <p>您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。</p>
                <p>讓我們一起朝更好的自己邁進，讓這份對跑步熱愛，連結起每一個熱血的靈魂。希望這裡不只是網站，更是跑者們的補給站。</p>
            </div>

            <div class="footer-note">
                ＊ 服務時間：週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
            </div>
        </div>
    </div>

    <!-- 紅線分界 -->
    <div class="red-line"></div>
</div>

</body>
</html>
