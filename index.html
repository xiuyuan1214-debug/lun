<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者服務中心</title>
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px 0;
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
        }

        .outer-wrapper {
            width: 90%;
            max-width: 400px;
        }

        .main-card {
            /* 操場奶黃底風格 */
            background-color: #ffe89b;
            background-image: 
                radial-gradient(circle at 50% 130%, transparent 60%, rgba(255,255,255,0.4) 61%, transparent 62%),
                radial-gradient(circle at 50% 130%, transparent 70%, rgba(255,255,255,0.4) 71%, transparent 72%),
                radial-gradient(rgba(0,0,0,0.02) 1px, transparent 0);
            background-size: 100% 100%, 100% 100%, 10px 10px;
            
            border-radius: 140px 140px 40px 40px;
            padding: 60px 30px 40px 30px;
            text-align: center;
            color: #5d4037;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 28px;
            margin: 0;
            letter-spacing: 2px;
        }

        .en-subtitle {
            font-size: 10px;
            letter-spacing: 3px;
            margin: 10px 0 30px 0;
            opacity: 0.8;
        }

        /* 對話框樣式 */
        .speech-bubble {
            background-color: #ffffff;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            color: #d4a017;
            margin-bottom: 40px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .speech-bubble::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0 10px;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
        }

        .text-body {
            text-align: left;
            line-height: 1.8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .text-body p {
            margin: 0 0 15px 0;
        }

        .footer-time {
            font-size: 10px;
            color: rgba(93, 64, 55, 0.6);
            border-top: 1px solid rgba(93, 64, 55, 0.1);
            padding-top: 20px;
            text-align: left;
        }

        /* 紅線 (完全保留) */
        .red-line-divider {
            width: 100%;
            height: 4px;
            background-color: #ff5252;
            margin-top: 25px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div class="outer-wrapper">
    <div class="main-card">
        <h1>跑者服務中心</h1>
        <div class="en-subtitle">RUNNER SERVICE CENTER</div>

        <div class="speech-bubble">
            讓我們聽見您的腳步聲
        </div>

        <div class="text-body">
            <p>無論您是因為突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷。</p>
            <p>您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。</p>
            <p>讓我們一起朝更好的自己邁進，讓這份對跑步熱愛，連結起每一個熱血的靈魂。
                希望這裡不只是網站，更是跑者們的補給站。</p>
        </div>

        <div class="footer-time">
            ＊ 服務時間：週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
        </div>
    </div>

    <!-- 紅線分界 -->
    <div class="red-line-divider"></div>
</div>

</body>
</html>
