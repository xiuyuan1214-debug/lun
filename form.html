<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者服務中心</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
        }

        /* 奶黃底操場格式 Header */
        .stadium-header {
            background-color: #FFFDD0; /* 奶黃底 */
            border-radius: 100px; /* 操場格式 */
            width: 100%;
            height: 120px;
            margin: 0 auto 30px auto;
            position: relative;
            
            /* 修正：將內部線條往上移至正中心 */
            display: flex;
            align-items: center; 
            justify-content: center;
        }

        /* 內部線條 */
        .inner-line {
            width: 85%;
            height: 1px;
            background-color: #000;
            margin: 0;
        }

        .header-content {
            position: absolute;
            text-align: center;
            width: 100%;
        }

        /* 表單內容完全復原 */
        .form-section {
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .captcha-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .captcha-input {
            width: 80px !important; /* 依照先前指令的寬度 */
        }

        .refresh-icon {
            cursor: pointer;
            font-size: 20px;
        }

        .service-notice {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="stadium-header">
        <div class="inner-line"></div>
        <div class="header-content">
            <h1 style="margin: 0; font-size: 24px;">跑者服務中心</h1>
            <p style="margin: 5px 0 0 0;">Runner Service Center</p>
        </div>
    </div>

    <div class="form-section">
        <form>
            <div class="form-group">
                <label>姓名 / Name</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>電子信箱 / E-mail</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>跑者屬性 / Runner Attributes</label>
                <select>
                    <option>新手跑者</option>
                    <option>半馬跑者</option>
                    <option>全馬跑者</option>
                    <option>專業教練</option>
                </select>
            </div>

            <div class="form-group">
                <label>個人最佳成績 (PB) / Personal Best</label>
                <input type="text" placeholder="例如: 04:30:00">
            </div>

            <div class="form-group">
                <label>目標挑戰 / Target Goal</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>穿戴裝置 / Wearable Device</label>
                <input type="text" placeholder="Garmin, Apple Watch, etc.">
            </div>

            <div class="form-group">
                <label>諮詢內容 / Inquiry</label>
                <textarea rows="4"></textarea>
            </div>

            <div class="form-group">
                <label>驗證碼 / Verification Code</label>
                <div class="captcha-group">
                    <input type="text" class="captcha-input">
                    <img src="#" alt="8A2F" style="background: #eee; padding: 5px;">
                    <span class="refresh-icon">↻</span>
                </div>
            </div>

            <button type="submit" style="width: 100%; padding: 12px; background: #000; color: #fff; border: none; cursor: pointer; font-size: 16px;">提交諮詢</button>
        </form>

        <div class="service-notice">
            週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
        </div>
    </div>

</body>
</html>
