<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者服務中心</title>
    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            position: relative;
            background: #ffe8a1; /* 基礎奶黃底 */
            border-radius: 120px 120px 50px 50px;
            width: 375px; /* 模擬手機寬度 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden; /* 確保內容不超出圓角 */
        }

        /* 操場跑道背景紋理 */
        .container::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            /* 使用多重徑向漸變和線性漸變模擬跑道弧線和顆粒感 */
            background-image: 
                radial-gradient(ellipse at 50% 120%, transparent 65%, rgba(139, 69, 19, 0.05) 66%, transparent 68%), /* 棕色弧線 (跑道) */
                radial-gradient(ellipse at 50% 120%, transparent 69%, rgba(139, 69, 19, 0.03) 70%, transparent 72%),
                radial-gradient(ellipse at 50% 120%, transparent 73%, rgba(139, 69, 19, 0.02) 74%, transparent 76%),
                radial-gradient(ellipse at 50% 120%, transparent 77%, rgba(139, 69, 19, 0.01) 78%, transparent 80%),
                radial-gradient(circle, rgba(139, 69, 19, 0.02) 1px, transparent 1px), /* 微小顆粒 */
                linear-gradient(rgba(255, 232, 161, 0.8), rgba(255, 232, 161, 0.8)); /* 疊加奶黃色透明度 */
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 8px 8px, 100% 100%;
            background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, repeat, no-repeat;
            opacity: 0.8; /* 控制背景圖案的整體深淺 */
            z-index: 1;
        }

        .header {
            position: relative;
            z-index: 2; /* 確保內容在背景紋理上方 */
            text-align: center;
            color: #5d4037; /* 深棕色文字 */
            padding-top: 60px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 5px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .highlight-box {
            position: relative;
            z-index: 2;
            display: inline-block;
            background: #fff8e1; /* 更亮一點的奶黃 */
            border-radius: 30px;
            padding: 8px 30px;
            color: #d1941c; /* 亮金色文字 */
            font-weight: bold;
            font-size: 18px;
            margin: 35px auto 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .content {
            position: relative;
            z-index: 2;
            color: #5d4037;
            padding: 30px 40px;
            line-height: 1.8;
            font-size: 15px;
            font-weight: 500;
        }

        .content p {
            margin: 0 0 20px 0;
        }

        .footer {
            position: relative;
            z-index: 2;
            color: rgba(93, 64, 55, 0.6); /* 半透明棕色 */
            font-size: 11px;
            padding: 0 40px 30px 40px;
            text-align: left;
        }

        /* 紅色裝飾線 (絕對不准動) */
        .red-line {
            width: 100%;
            height: 4px;
            background: #ff4747;
            border-radius: 2px;
            margin-top: 10px; /* 這裡的 margin-top 是為了對齊，紅線本身不變 */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>跑者服務中心</h1>
            <div class="subtitle">RUNNER SERVICE CENTER</div>
        </div>

        <div style="text-align: center;">
            <div class="highlight-box">
                讓我們聽見您的腳步聲
            </div>
        </div>

        <div class="content">
            <p>無論您是因為突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷 ☺️</p>
            <p>您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。</p>
            <p>讓我們一起朝更好的自己邁進，讓這份對跑步熱愛，連結起每一個熱血的靈魂。希望這裡不只是網站，更是跑者們的補給站。</p>
        </div>

        <div class="footer">
            ＊ 服務時間：週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
        </div>

        <!-- 紅色裝飾線 (紅線以上內容完全保留，位置精確) -->
        <div class="red-line"></div>
    </div>
</body>
</html>
