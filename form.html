<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Service Center</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; }
        
        .top-navbar {
            background-color: #333333;
            width: 100%;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-inner {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }
        .nav-link { color: #ffffff; text-decoration: none; font-size: 14px; }

        .playground-header {
            background-color: #fcf6e3; 
            border-bottom-left-radius: 50% 30%; 
            border-bottom-right-radius: 50% 30%;
            padding: 25px 35px 12px 35px; 
            text-align: center;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            position: relative;
        }

        /* 弧線：寬度增至 105px，確保與文字區塊完全分離，絕不壓字 */
        .playground-header::before {
            content: "";
            position: absolute;
            top: 15px;
            left: 105px; 
            right: 105px; 
            bottom: 5px; 
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-bottom-left-radius: 80px 40px;
            border-bottom-right-radius: 80px 40px;
            pointer-events: none;
        }
        
        .title { color: #8b7355; font-size: 28px; font-weight: bold; margin: 0; letter-spacing: 2px; }
        .en-subtitle { color: #b5a442; font-size: 11px; margin: 2px 0 10px 0; letter-spacing: 3px; }
        
        .cta-button {
            background-color: #ffffff;
            color: #d47a3c; 
            padding: 8px 30px;
            border-radius: 35px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 18px;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 16px;
        }

        .copywriting {
            font-size: 13.5px;
            line-height: 1.6;
            color: #7a6e5d;
            text-align: left;
            margin: 0 auto 5px auto;
            max-width: 88%;
        }
        .copywriting p { margin: 0 0 4px 0; } 

        .footer-info {
            font-size: 6px; 
            color: #9b8e76; 
            line-height: 1.5;
            margin-top: 5px;
            padding-bottom: 15px; 
            position: relative;
            z-index: 10;
        }

        .form-container { width: 100%; max-width: 500px; padding: 30px 35px; box-sizing: border-box; }
        .field { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #8b7355; font-size: 14px; }
        
        input, select, textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            background-color: #fdfaf2;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            color: #666666;
        }

        /* 驗證碼並列樣式復原 */
        .captcha-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .captcha-img {
            height: 35px;
            background-color: #e0e0e0;
            border-radius: 4px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            font-style: italic;
            color: #8b7355;
            font-weight: bold;
            white-space: nowrap;
        }

        .submit-btn {
            width: 100%;
            background-color: #554d44;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-link">教練資歷</a>
            <a href="courses.html" class="nav-link">課程簡介</a>
            <a href="pace_tool.html" class="nav-link">配速工具</a>
            <a href="training_log.html" class="nav-link">訓練日誌</a>
            <a href="race_log.html" class="nav-link">賽事日誌</a>
        </div>
    </nav>

    <header class="playground-header">
        <h1 class="title">跑者服務中心</h1>
        <div class="en-subtitle">RUNNER SERVICE CENTER</div>
        <div class="cta-button">讓我們聽見您的腳步聲</div>
        <div class="copywriting">
            <p>無論您是因突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷。</p>
            <p>您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。</p>
            <p>讓我們一起朝更好的方向邁進，讓這份對跑步熱愛，連結起每一個熱血的靈魂。</p>
            <p>希望這裡不只是網站，更是跑者們的補給站。</p>
        </div>
        <div class="footer-info">
            服務時間：週一至週五 09:00-18:00<br>
            (跑者不停息，但小編需要一些運動時間)
        </div>
    </header>

    <div class="form-container">
        <div class="field">
            <label>姓名 / Name</label>
            <input type="text" placeholder="請輸入您的姓名">
        </div>
        <div class="field">
            <label>電子信箱 / E-mail</label>
            <input type="email" placeholder="runner@example.com">
        </div>
        <div class="field">
            <label>跑者屬性 / Runner Type</label>
            <select>
                <option value="">請選擇 / Please Select</option>
                <option value="beginner">新手跑者 / Beginner Runner</option>
                <option value="half-marathon">半馬跑者 / Half Marathon Runner</option>
                <option value="marathon">全馬跑者 / Full Marathon Runner</option>
                <option value="ultra-trail">超馬/越野跑者 / Ultra & Trail Runner</option>
            </select>
        </div>
        <div class="field">
            <label>跑步最佳成績 (PB)</label>
            <input type="text" placeholder="例如：全馬 3:30:00">
        </div>
        <div class="field">
            <label>目標成績</label>
            <input type="text" placeholder="例如：全馬 2:59:59">
        </div>
        <div class="field">
            <label>慣用穿戴配備</label>
            <input type="text" placeholder="例如：Garmin, Apple Watch, Coros">
        </div>
        <div class="field">
            <label>您的問題</label>
            <textarea rows="6" style="resize: none;" placeholder="每一滴汗水，都值得被聽見..."></textarea>
        </div>
        <!-- 復原驗證碼並列樣式 -->
        <div class="field">
            <label>驗證碼 / Verification Code</label>
            <div class="captcha-group">
                <input type="text" placeholder="請輸入右側驗證碼" style="flex: 1;">
                <div class="captcha-img">R 8 N 2</div>
            </div>
        </div>
        <button type="button" class="submit-btn">送出表單 / Submit Form</button>
    </div>

</body>
</html>
