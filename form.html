<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者服務中心 / Runner Service Center</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
        }

        /* 奶黃底操場格式 Header */
        .stadium-header {
            background-color: #FFFDD0; /* 奶黃底 */
            border: 2px solid #000;
            border-radius: 100px; /* 操場格式 */
            width: 100%;
            height: 150px;
            margin: 0 auto 20px auto;
            position: relative;
            
            /* 執行指令：將內部線條垂直置中 */
            display: flex;
            align-items: center; 
            justify-content: center;
        }

        .inner-line {
            width: 90%;
            height: 1px;
            background-color: #000;
            z-index: 1;
        }

        .header-title {
            position: absolute;
            background-color: #FFFDD0;
            padding: 0 20px;
            font-weight: bold;
            font-size: 1.8rem;
            z-index: 2;
            text-align: center;
        }

        /* 導覽功能區 */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .nav-links a {
            text-decoration: none;
            color: #000;
            border: 1px solid #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #000;
            box-sizing: border-box;
        }

        /* 驗證碼框縮小 */
        .captcha-input {
            width: 80px !important;
        }

        .captcha-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .service-notice {
            margin-top: 40px;
            text-align: center;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- 跑者服務中心 Header -->
    <div class="stadium-header">
        <div class="header-title">
            跑者服務中心<br>
            <span style="font-size: 1.2rem;">Runner Service Center</span>
        </div>
        <div class="inner-line"></div>
    </div>

    <!-- 完整導覽區 -->
    <div class="nav-links">
        <a href="#">配速工具 / Pace Tool</a>
        <a href="#">賽事日誌 / Race Log</a>
        <a href="#">訓練日誌 / Training Log</a>
    </div>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label>姓名 / Name</label>
                <input type="text" placeholder="請輸入姓名">
            </div>

            <div class="form-group">
                <label>電子信箱 / E-mail</label>
                <input type="email" placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label>跑者屬性 / Runner Attributes</label>
                <select>
                    <option value="">請選擇</option>
                    <option value="1">新手跑者</option>
                    <option value="2">半馬跑者</option>
                    <option value="3">全馬跑者</option>
                    <option value="4">專業教練</option>
                </select>
            </div>

            <div class="form-group">
                <label>個人最佳成績 (PB) / Personal Best</label>
                <input type="text" placeholder="HH:MM:SS">
            </div>

            <div class="form-group">
                <label>目標挑戰 / Target Goal</label>
                <input type="text" placeholder="欲挑戰的賽事或成績">
            </div>

            <div class="form-group">
                <label>穿戴裝置 / Wearable Device</label>
                <input type="text" placeholder="Garmin, Apple Watch, etc.">
            </div>

            <div class="form-group">
                <label>諮詢內容 / Inquiry</label>
                <textarea rows="5"></textarea>
            </div>

            <div class="form-group">
                <label>驗證碼 / Verification Code</label>
                <div class="captcha-container">
                    <input type="text" class="captcha-input">
                    <span style="background: #eee; padding: 5px; border: 1px solid #000;">8A2F</span>
                    <span style="cursor: pointer; font-size: 20px;">↻</span> <!-- 重新整理符號 -->
                </div>
            </div>

            <button type="submit">送出諮詢 / Submit</button>
        </form>

        <div class="service-notice">
            週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
        </div>
    </div>

</body>
</html>
