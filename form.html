<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding-top: 20px;
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        }

        .card-container {
            width: 100%;
            max-width: 600px;
            background-color: #fee9a0;
            border-radius: 180px 180px 50px 50px;
            padding: 60px 45px 40px 45px;
            box-sizing: border-box;
            text-align: center;
            color: #6d4c41;
            position: relative;
        }

        h1 {
            font-size: 42px;
            margin: 0;
            letter-spacing: 4px;
            font-weight: 800;
        }

        .english-title {
            font-size: 14px;
            letter-spacing: 6px;
            margin: 15px 0 35px 0;
            font-weight: bold;
            opacity: 0.8;
        }

        .highlight-banner {
            background-color: rgba(255, 255, 255, 0.4);
            display: inline-block;
            padding: 10px 35px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            color: #d1941c;
            margin-bottom: 40px;
        }

        .content-body {
            text-align: left;
            line-height: 1.8;
            font-size: 17px;
            margin-bottom: 45px;
        }

        .content-body p {
            margin-bottom: 25px;
        }

        .footer-info {
            font-size: 13px;
            color: rgba(109, 76, 65, 0.7);
            border-top: 1px solid rgba(109, 76, 65, 0.1);
            padding-top: 25px;
            text-align: left;
            line-height: 1.5;
        }

        /* 紅線裝飾（模擬圖片中的分界線） */
        .red-line-divider {
            width: 100%;
            height: 4px;
            background-color: #ff5252;
            margin-top: 30px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div style="width: 100%; max-width: 600px;">
    <div class="card-container">
        <h1>跑者服務中心</h1>
        <div class="english-title">RUNNER SERVICE CENTER</div>

        <div class="highlight-banner">
            讓我們聽見您的腳步聲
        </div>

        <div class="content-body">
            <p>無論您是因為突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷 ☺️</p>
            <p>您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。</p>
            <p>讓我們一起朝更好的自己邁進，讓這份對跑步熱愛，連結起每一個熱血的靈魂。希望這裡不只是網站，更是跑者們的補給站。</p>
        </div>

        <div class="footer-info">
            ＊ 服務時間：週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
        </div>
    </div>

    <!-- 紅線分界 -->
    <div class="red-line-divider"></div>
</div>

</body>
</html>
