    <title>Runner Service Center</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #ffffff; }
        
        /* 導覽列：精確深灰色 #333333 */
        .top-navbar {
            background-color: #333333;
            padding: 15px 0;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-inner {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }

            font-size: 14px;
        }

        /* 頁首：嚴格奶黃色 #fcf6e3 與高拱形拋物線 */

            background-color: #fcf6e3; 
            border-bottom-left-radius: 50% 20%; 
            border-bottom-right-radius: 50% 20%;
            padding: 60px 30px 90px 30px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .title { color: #8b7355; font-size: 26px; font-weight: bold; margin: 0; }
        .en-subtitle { color: #b5a442; font-size: 11px; margin: 5px 0 25px 0; }

            background-color: #ffffff;
            color: #d47a3c; 
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 30px;
        }

        .main-copywriting {
            font-size: 12.5px;
            line-height: 1.8;

    <header class="playground-header">

        <div class="main-copywriting">
            無論您是因突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們。<br><br>
            您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。<br><br>
            讓我們一起朝更好的方向邁進，讓這份對跑步熱愛，連結每一個熱血的靈魂。<br><br>
            希望這裡不只是起點，更是跑者們的補給站 ◡̈
