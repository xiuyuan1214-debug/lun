<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者能量補給站 - Runner Service Center</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background-color: #ffffff;
            color: #555555;
        }

        /* 圖 2：黑色最上層選項導覽列 */
        .top-nav {
            background-color: #333333; /* 黑色背景 */
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }
        .nav-container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }
        .nav-item {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .main-wrapper {
            max-width: 500px;
            margin: 0 auto;
            background-color: #fff;
        }

        /* 圖 1：奶黃色高拱形拋物線頁首 */
        .header-playground {
            background-color: #fcf6e3; /* 奶黃色 */
            border-bottom-left-radius: 50% 20%;
            border-bottom-right-radius: 50% 20%;
            padding: 50px 35px 70px 35px;
            text-align: center;
        }

        .header-playground h1 {
            color: #8b7355; /* 深褐色 */
            font-size: 26px;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        .header-playground .sub-title {
            color: #b5a442;
            font-size: 11px;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
        }

        .highlight-btn {
            background-color: #ffffff;
            color: #d47a3c; /* 亮橘色 */
            padding: 8px 25px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .intro-text {
            font-size: 12.5px;
            line-height: 1.8;
            color: #666;
            text-align: left;
            margin-bottom: 25px;
        }

        .service-hours {
            font-size: 10px;
            color: #aaa;
            line-height: 1.5;
        }

        /* 表單區域 */
        .form-content {
            padding: 40px 35px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #444;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #f2f2f2;
            border-radius: 12px;
            background-color: #fafafa;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .v-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .v-input { width: 90px; }
        .v-code {
            background: #f0f0f0;
            padding: 10px 18px;
            border-radius: 8px;
            font-family: monospace;
            letter-spacing: 4px;
            font-weight: bold;
        }

        /* 送出按鈕 (深褐色) */
        .submit-btn {
            width: 100%;
            background-color: #554d44; /* 深咖啡色 */
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 黑色最上層選項導覽列 (圖 2) -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-item">教練資歷</a>
            <a href="courses.html" class="nav-item">課程簡介</a>
            <a href="pace_tool.html" class="nav-item">配速工具</a>
            <a href="training_log.html" class="nav-item">訓練日誌</a>
            <a href="race_log.html" class="nav-item">賽事日誌</a>
        </div>
    </nav>

    <div class="main-wrapper">
        <!-- 奶黃色操場頁首 (圖 1) -->
        <div class="header-playground">
            <h1>跑者能量補給站</h1>
            <div class="sub-title">RUNNERS ENERGY STATION</div>
            
            <div class="highlight-btn">讓我們聽見您的腳步聲</div>
            
            <div class="intro-text">
                無論您是因突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們。<br><br>
                您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。<br><br>
                讓我們一起朝更好的方向邁進，讓這份對跑步熱愛，連結每一個熱血的靈魂。<br><br>
                希望這裡不只是起點，更是跑者們的補給站 ◡̈
            </div>

            <div class="service-hours">
                客服服務時間：週一至週五 09:00-18:00<br>
                跑者不停息，但小編需要一些運動時間
            </div>
        </div>

        <!-- 表單內容 -->
        <div class="form-content">
            <form>
                <div class="form-group">
                    <label>姓名 / Name</label>
                    <input type="text" placeholder="請輸入您的姓名">
                </div>

                <div class="form-group">
                    <label>電子信箱 / E-mail</label>
                    <input type="email" placeholder="runner@gmail.com">
                </div>

                <div class="form-group">
                    <label>跑者屬性 / Runner Type</label>
                    <select>
                        <option value="">請選擇 / Please Select</option>
                        <option>初階跑者 / Beginner</option>
                        <option>馬拉松跑者 / Marathoner</option>
                        <option>超馬、越野跑者 / Ultra & Trail</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>最佳成績 / Personal Best</label>
                    <input type="text" placeholder="例如：全馬3:30:00">
                </div>

                <div class="form-group">
                    <label>目標成績 / Target Goal</label>
                    <input type="text" placeholder="例如：全馬2:59:59">
                </div>

                <div class="form-group">
                    <label>穿戴配備 / Wearable Device</label>
                    <input type="text" placeholder="例如：Garmin, Apple Watch, Coros">
                </div>

                <div class="form-group">
                    <label>您的問題 / Your Inquiry</label>
                    <textarea placeholder="每一滴汗水，都值得被聽見..."></textarea>
                </div>

                <div class="form-group">
                    <label>驗證碼 / Verification Code</label>
                    <div class="v-container">
                        <input type="text" class="v-input" placeholder="輸入碼">
                        <div class="v-code">1 8 0 X</div>
                        <span style="cursor:pointer; font-size: 18px;">↻</span>
                    </div>
                </div>

                <button type="button" class="submit-btn">送出表單 / Submit Form</button>
            </form>
        </div>
    </div>

</body>
</html>
