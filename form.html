<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Service Center</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; }
        
        .top-navbar {
            background-color: #333333;
            width: 100%;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-inner {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }
        .nav-link { color: #ffffff; text-decoration: none; font-size: 14px; }

        .playground-header {
            background-color: #fcf6e3; 
            border-bottom-left-radius: 50% 25%; 
            border-bottom-right-radius: 50% 25%;
            padding: 20px 20px 30px 20px; 
            text-align: center;
            width: 100%;
            max-width: 280px; 
            box-sizing: border-box;
            position: relative;
        }

        /* 修正跑道線條：置中呈現 */
        .playground-header::before {
            content: "";
            position: absolute;
            top: 120px; /* 垂直置中調整 */
            left: 50px; /* 水平置中調整 */
            right: 50px; /* 水平置中調整 */
            bottom: 20px; /* 垂直置中調整 */
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-top-left-radius: 180px;
            border-top-right-radius: 180px;
            border-bottom-left-radius: 180px 100px; 
            border-bottom-right-radius: 180px 100px;
            pointer-events: none;
            z-index: 1;
        }
        
        .title { color: #8b7355; font-size: 28px; font-weight: bold; margin: 0; letter-spacing: 2px; position: relative; z-index: 10; }
        .en-subtitle { color: #b5a442; font-size: 11px; margin: 2px 0 15px 0; letter-spacing: 3px; position: relative; z-index: 10; }
        
        .cta-button {
            background-color: #ffffff;
            color: #d47a3c; 
            padding: 4px 12px;
            border-radius: 35px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px; 
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 16px;
            position: relative;
            z-index: 10;
        }

        .copywriting {
            font-size: 11.5px;
            line-height: 1.7;
            color: #7a6e5d;
            text-align: left;
            margin: 0 auto;
            max-width: 100%;
