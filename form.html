<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者能量補給站</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            background-color: #f9f9f9;
            color: #8D7353;
        }

        /* 最上層導覽列 (圖2修正) */
        .nav-bar {
            background-color: #333;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            text-align: center;
        }
        .nav-bar a {
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column; /* 英文置於底部 */
            line-height: 1.2;
        }
        .nav-bar .cn { font-size: 16px; font-weight: bold; }
        .nav-bar .en { font-size: 11px; opacity: 0.8; margin-top: 2px; }

        .main-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 奶黃底操場格式 (標題與空格修正) */
        .stadium-header {
            background-color: #FFF9E7;
            border-radius: 120px;
            padding: 20px 30px 30px 30px; /* 縮小上層空格 */
            text-align: center;
            margin-bottom: 30px;
        }

        .title-main { font-size: 26px; font-weight: bold; margin: 0; }
        .title-sub { font-size: 14px; letter-spacing: 2px; margin: 5px 0 15px 0; color: #C5B08A; }

        /* 縮減左右距離的框框 */
        .highlight-box {
            background-color: #ffffff;
            color: #D28B52;
            padding: 8px 15px; /* 縮減左右距離 */
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 0px; /* 準備接續下方內容 */
        }

        /* 內線條已依指令刪除 */

        .description {
            font-size: 13px;
            line-height: 1.8;
            text-align: justify;
            margin: 20px 0 10px 0;
        }

        /* 縮小服務時間上層空格 */
        .service-time {
            font-size: 11px;
            color: #C5B08A;
            margin-top: 5px; 
            line-height: 1.4;
        }

        /* 表單內容完整復原 (圖1樣式) */
        .form-section { background: white; padding: 20px; border-radius: 15px; }
        .form-group { margin-bottom: 20px; }
        .form-label { font-weight: bold; font-size: 15px; margin-bottom: 8px; display: block; }
        
        .input-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #EAEAEA;
            background-color: #FDFDFD;
            border-radius: 10px;
            box-sizing: border-box;
            color: #555;
            font-size: 14px;
        }

        .captcha-row { display: flex; align-items: center; gap: 10px; }
        .captcha-input { width: 80px !important; }
        .refresh-icon { cursor: pointer; font-size: 16px; }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: #4E4A46; /* 圖1深色按鈕 */
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <a href="coach.html"><span class="cn">教練資歷</span><span class="en">Coach Profile</span></a>
        <a href="course.html"><span class="cn">課程簡介</span><span class="en">Course</span></a>
        <a href="pace.html"><span class="cn">配速工具</span><span class="en">Pace Tool</span></a>
        <a href="training.html"><span class="cn">訓練日誌</span><span class="en">Training Log</span></a>
        <a href="race.html"><span class="cn">賽事日誌</span><span class="en">Race Log</span></a>
    </nav>

    <div class="main-container">
        <div class="stadium-header">
            <h1 class="title-main">跑者能量補給站</h1>
            <p class="title-sub">RUNNERS ENERGY STATION</p>
            
            <div class="highlight-box">讓我們聽見您的腳步聲</div>

            <div class="description">
                無論您是因突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷。<br><br>
                您的回饋是我們進化的動力，您的提問是我們探索的方向...（內容略）
            </div>

            <div class="service-time">
                服務時間：週一至週五 09:00-18:00<br>
                (跑者不休息，但小編需要一些運動時間)
            </div>
        </div>

        <div class="form-section">
            <form>
                <div class="form-group">
                    <label class="form-label">姓名 / Name</label>
                    <input type="text" class="input-box" placeholder="請輸入您的姓名">
                </div>

                <div class="form-group">
                    <label class="form-label">電子信箱 / E-mail</label>
                    <input type="email" class="input-box" placeholder="runner@gmail.com">
                </div>

                <div class="form-group">
                    <label class="form-label">跑者屬性 / Runner Type</label>
                    <select class="input-box">
                        <option>請選擇 / Please Select</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">最佳成績 / Personal Best</label>
                    <input type="text" class="input-box" placeholder="例如：全馬3:30:00">
                </div>

                <div class="form-group">
                    <label class="form-label">目標成績 / Target Goal</label>
                    <input type="text" class="input-box" placeholder="例如：全馬2:59:59">
                </div>

                <div class="form-group">
                    <label class="form-label">穿戴配備 / Wearable Device</label>
                    <input type="text" class="input-box" placeholder="例如：Garmin, Apple Watch, Coros">
                </div>

                <div class="form-group">
                    <label class="form-label">您的問題 / Your Inquiry</label>
                    <textarea class="input-box" rows="5" placeholder="每一滴汗水，都值得被聽見..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">驗證碼 / Verification Code</label>
                    <div class="captcha-row">
                        <input type="text" class="input-box captcha-input" placeholder="輸入碼">
                        <span style="letter-spacing: 2px; font-weight: bold;">7 W 8 Q</span>
                        <span class="refresh-icon">↻</span>
                    </div>
                </div>

                <button type="submit" class="submit-btn">送出表單 / Submit Form</button>
            </form>
        </div>
    </div>

</body>
</html>
