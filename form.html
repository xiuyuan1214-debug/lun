<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Service Center</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; }
        
        /* 導覽列：不准動 */
        .top-navbar {
            background-color: #333333;
            width: 100%;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-inner {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }
        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
        }

        /* 奶黃底區塊 */
        .playground-header {
            background-color: #fcf6e3; 
            border-bottom-left-radius: 50% 30%; 
            border-bottom-right-radius: 50% 30%;
            padding: 25px 35px 20px 35px; 
            text-align: center;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            position: relative;
        }

        /* 跑道線條：不准動 */
        .playground-header::before {
            content: "";
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-bottom-left-radius: 200px 100px;
            border-bottom-right-radius: 200px 100px;
            pointer-events: none;
        }
        
        .title { color: #8b7355; font-size: 28px; font-weight: bold; margin: 0; letter-spacing: 2px; }
        .en-subtitle { color: #b5a442; font-size: 11px; margin: 2px 0 10px 0; letter-spacing: 3px; }
        
        .cta-button {
            background-color: #ffffff;
            color: #d47a3c; 
            padding: 8px 30px;
            border-radius: 35px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 16px;
        }

        /* 文字高度調整：與照片完全一樣 */
        .copywriting {
            font-size: 13.5px;
            line-height: 1.8; /* 依照照片調大行高 */
            color: #7a6e5d;
            text-align: left;
            margin: 0 auto 5px auto;
            max-width: 88%;
        }

        /* 服務時間：顏色與照片完全一樣 */
        .footer-info {
            font-size: 10px;
            color: #9b8e76; /* 依照照片校正色碼 */
            line-height: 1.3;
            opacity: 0.9;
            margin-top: 5px;
            padding-bottom: 10px; 
        }

        /* 表單區域：維持原狀不准動 */
        .form-container { width: 100%; max-width: 500px; padding: 30px 35px; box-sizing: border-box; }
        .field { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #8b7355; font-size: 14px; }
        
        input, select, textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            background-color: #fdfaf2;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            color: #666666;
        }

        .submit-btn {
            width: 100%;
            background-color: #554d44;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 驗證碼：不准動 */
        .captcha-area { display: flex; align-items: center; gap: 6px; }
        .captcha-input { width: 60px !important; padding: 5px 8px !important; font-size: 12px; }
        .captcha-code { background: #f4f4f4; padding: 5px 10px; border-radius: 6px; font-weight: bold; letter-spacing: 2px; font-size: 12px; }
        .refresh-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: #888; padding: 0; }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-link">教練資歷</a>
            <a href="courses.html" class="nav-link">課程簡介</a>
            <a href="pace_tool.html" class="nav-link">配速工具</a>
            <a href="training_log.html" class="nav-link">訓練日誌</a>
            <a href="race_log.html" class="nav-link">賽事日誌</a>
        </div>
    </nav>

    <header class="playground-header">
        <h1 class="title">跑者能量補給站</h1>
        <div class="en-subtitle">RUNNERS ENERGY STATION</div>
        <div class="cta-button">讓我們聽見您的腳步聲</div>
        <div class="copywriting">
            無論您是因突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷。
            您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。
            讓我們一起朝更好的方向邁進，讓這份對跑步熱愛，連結起每一個熱血的靈魂。
            希望這裡不只是網站，更是跑者們的補給站 ◡̈
        </div>
        <div class="footer-info">
            ※ 服務時間：週一至週五 09:00-18:00<br>
            (跑者不停息，但小編需要一些運動時間)
        </div>
    </header>

    <div class="form-container">
        <div class="field">
            <label>姓名 / Name</label>
            <input type="text" placeholder="請輸入您的姓名">
        </div>
        <div class="field">
            <label>電子信箱 / E-mail</label>
            <input type="email" placeholder="runner@gmail.com">
        </div>
        <div class="field">
            <label>跑者屬性 / Runner Type</label>
            <select>
                <option value="">請選擇 / Please Select</option>
                <option value="beginner">新手跑者 / Beginner Runner</option>
                <option value="half-marathon">半馬跑者 / Half Marathon Runner</option>
                <option value="marathon">全馬跑者 / Full Marathon Runner</option>
                <option value="ultra-trail">超馬/越野跑者 / Ultra & Trail Runner</option>
            </select>
        </div>
        <div class="field">
            <label>最佳成績 / Personal Best</label>
            <input type="text" placeholder="例如：全馬3:30:00">
        </div>
        <div class="field">
            <label>目標成績 / Target Goal</label>
            <input type="text" placeholder="例如：全馬2:59:59">
        </div>
        <div class="field">
            <label>穿戴配備 / Wearable Device</label>
            <input type="text" placeholder="例如：Garmin, Apple Watch, Coros">
        </div>
        <div class="field">
            <label>您的問題 / Your Inquiry</label>
            <textarea rows="6" style="resize: none;" placeholder="每一滴汗水，都值得被聽見..."></textarea>
        </div>
        <div class="field">
            <label>驗證碼 / Verification Code</label>
            <div class="captcha-area">
                <input type="text" class="captcha-input" placeholder="輸入碼">
                <div class="captcha-code">1 8 0 X</div>
                <button type="button" class="refresh-btn">↻</button>
            </div>
        </div>
        <button type="button" class="submit-btn">送出表單 / Submit Form</button>
    </div>

</body>
</html>
