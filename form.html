<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者能量補給站</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            background-color: #ffffff;
            color: #8D7353;
        }

        /* 導覽列修正 (圖2樣式)：刪除 / 符號，英文縮小置於底部 */
        .nav-bar {
            background-color: #333;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            text-align: center;
        }
        .nav-bar a {
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .nav-bar .cn { font-size: 16px; font-weight: bold; }
        .nav-bar .en { font-size: 10px; opacity: 0.9; margin-top: 2px; text-transform: uppercase; }

        .main-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 標題區修正：縮小空格、改名、刪除線條 */
        .stadium-header {
            background-color: #FFF9E7;
            border-radius: 120px;
            padding: 20px 30px; /* 縮小上層空格 */
            text-align: center;
            margin-bottom: 30px;
        }

        .title-main { font-size: 26px; font-weight: bold; margin: 0; color: #8D7353; }
        .title-sub { font-size: 14px; letter-spacing: 2px; margin: 5px 0 15px 0; color: #C5B08A; }

        .highlight-box {
            background-color: #ffffff;
            color: #D28B52;
            padding: 8px 15px; /* 縮減左右距離 */
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        /* 內容文字完整復原 */
        .description {
            font-size: 13px;
            line-height: 1.8;
            text-align: justify;
            margin: 15px 0;
            color: #8D7353;
        }

        /* 縮小空格 */
        .service-time {
            font-size: 11px;
            color: #C5B08A;
            margin-top: 5px; 
            line-height: 1.5;
        }

        /* 表單內容復原 (圖1配色與文字) */
        .form-group { margin-bottom: 25px; }
        .form-label { font-weight: bold; font-size: 15px; margin-bottom: 10px; display: block; color: #8D7353; }
        
        .input-box {
            width: 100%;
            padding: 14px;
            border: 1px solid #F0F0F0;
            background-color: #F8F8F8; /* 復原配色 */
            border-radius: 12px;
            box-sizing: border-box;
            color: #333;
            font-size: 14px;
        }
        .input-box::placeholder { color: #C0C0C0; }

        .captcha-row { display: flex; align-items: center; gap: 10px; }
        .captcha-input { width: 90px !important; }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #4E4A46; /* 圖1深咖啡色 */
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 修正轉跳與格式導覽列 -->
    <nav class="nav-bar">
        <a href="coach.html"><span class="cn">教練資歷</span><span class="en">Coach Profile</span></a>
        <a href="course.html"><span class="cn">課程簡介</span><span class="en">Course</span></a>
        <a href="pace.html"><span class="cn">配速工具</span><span class="en">Pace Tool</span></a>
        <a href="training.html"><span class="cn">訓練日誌</span><span class="en">Training Log</span></a>
        <a href="race.html"><span class="cn">賽事日誌</span><span class="en">Race Log</span></a>
    </nav>

    <div class="main-container">
        <div class="stadium-header">
            <!-- 更名為 跑者能量補給站 / RUNNERS ENERGY STATION -->
            <h1 class="title-main">跑者能量補給站</h1>
            <p class="title-sub">RUNNERS ENERGY STATION</p>
            
            <div class="highlight-box">讓我們聽見您的腳步聲</div>

            <!-- 完整復原所有段落文字 -->
            <div class="description">
                無論您是因突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷。<br><br>
                讓我們一起朝更好的方向邁進，讓這份對跑步的熱愛，連結起每一個熱血的靈魂。<br><br>
                希望這裡不只是網站，更是跑者們的補給站ᴗ̈
            </div>

            <!-- 服務時間區塊 -->
            <div class="service-time">
                服務時間：週一至週五 09:00-18:00<br>
                （跑者不休息，但小編需要一些運動時間)
            </div>
        </div>

        <form>
            <div class="form-group">
                <label class="form-label">姓名 / Name</label>
                <input type="text" class="input-box" placeholder="請輸入您的姓名">
            </div>

            <div class="form-group">
                <label class="form-label">電子信箱 / E-mail</label>
                <input type="email" class="input-box" placeholder="runner@gmail.com">
            </div>

            <div class="form-group">
                <label class="form-label">跑者屬性 / Runner Type</label>
                <select class="input-box" style="appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2214%22%20height%3D%228%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cpath%20d%3D%22m1%201%206%206%206-6%22%20stroke%3D%22%238D7353%22%20stroke-width%3D%222%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 15px center;">
                    <option>請選擇 / Please Select</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">最佳成績 / Personal Best</label>
                <input type="text" class="input-box" placeholder="例如：全馬3:30:00">
            </div>

            <div class="form-group">
                <label class="form-label">目標成績 / Target Goal</label>
                <input type="text" class="input-box" placeholder="例如：全馬2:59:59">
            </div>

            <div class="form-group">
                <label class="form-label">穿戴配備 / Wearable Device</label>
                <input type="text" class="input-box" placeholder="例如：Garmin, Apple Watch, Coros">
            </div>

            <div class="form-group">
                <label class="form-label">您的問題 / Your Inquiry</label>
                <textarea class="input-box" rows="6" placeholder="每一滴汗水，都值得被聽見..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">驗證碼 / Verification Code</label>
                <div class="captcha-row">
                    <input type="text" class="input-box captcha-input" placeholder="輸入碼">
                    <span style="letter-spacing: 2px; font-weight: bold; color: #333;">7 W 8 Q</span>
                    <span style="cursor: pointer;">↻</span>
                </div>
            </div>

            <button type="submit" class="submit-btn">送出表單 / Submit Form</button>
        </form>
    </div>

</body>
</html>
