<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Service Center</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; }
        
        .top-navbar {
            background-color: #333333;
            width: 100%;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-inner {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }
        .nav-link { color: #ffffff; text-decoration: none; font-size: 14px; }

        .playground-header {
            background-color: #fcf6e3; 
            border-bottom-left-radius: 50% 25%; 
            border-bottom-right-radius: 50% 25%;
            padding: 20px 20px 30px 20px; 
            text-align: center;
            width: 100%;
            max-width: 240px; /* 寬度再次縮減 */
            box-sizing: border-box;
            position: relative;
        }

        /* 修正跑道線條：嚴禁覆蓋標題字，移至按鈕與標題下方的文案區域 */
        .playground-header::before {
            content: "";
            position: absolute;
            top: 130px; /* 大幅下移，確保不覆蓋標題文字 */
            left: 4px; 
            right: 4px; 
            bottom: 5px; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-top-left-radius: 180px;
            border-top-right-radius: 180px;
            border-bottom-left-radius: 180px 100px; 
            border-bottom-right-radius: 180px 100px;
            pointer-events: none;
        }
        
        .title { color: #8b7355; font-size: 28px; font-weight: bold; margin: 0; letter-spacing: 2px; position: relative; z-index: 10; }
        .en-subtitle { color: #b5a442; font-size: 11px; margin: 2px 0 15px 0; letter-spacing: 3px; position: relative; z-index: 10; }
        
        .cta-button {
            background-color: #ffffff;
            color: #d47a3c; 
            padding: 4px 12px;
            border-radius: 35px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px; 
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 16px;
            position: relative;
            z-index: 10;
        }

        .copywriting {
            font-size: 11.5px;
            line-height: 1.7;
            color: #7a6e5d;
            text-align: left;
            margin: 0 auto;
            max-width: 100%;
            position: relative;
            z-index: 10;
        }
        .copywriting p { margin: 0 0 8px 0; } 

        .footer-info {
            font-size: 6px; 
            color: #9b8e76; 
            line-height: 1.5;
            margin-top: 5px;
            position: relative;
            z-index: 10;
        }

        .form-container { width: 100%; max-width: 500px; padding: 30px 35px; box-sizing: border-box; }
        .field { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #8b7355; font-size: 14px; }
        
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            background-color: #fdfaf2;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            color: #666666;
        }

        .small-input {
            padding: 6px 12px;
            font-size: 12px;
            height: 34px;
        }

        .captcha-group { display: flex; gap: 8px; align-items: center; }
        
        .captcha-input { 
            height: 34px !important; 
            width: 100px !important; 
            padding: 0 10px !important; 
            text-align: center;
            font-size: 13px;
            box-sizing: border-box;
        }
        .captcha-img {
            height: 24px;
            width: 45px;
            background-color: #e0e0e0;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-style: italic;
            color: #8b7355;
            font-weight: bold;
            font-size: 11px;
            box-sizing: border-box;
        }
        .refresh-icon { cursor: pointer; color: #8b7355; font-size: 20px; user-select: none; }

        .submit-btn {
            width: 100%;
            background-color: #554d44;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-link">教練資歷</a>
            <a href="courses.html" class="nav-link">課程簡介</a>
            <a href="tools.html" class="nav-link">配速工具</a>
            <a href="training.html" class="nav-link">訓練日誌</a>
            <a href="match.html" class="nav-link">賽事日誌</a>
        </div>
    </nav>

    <header class="playground-header">
        <h1 class="title">跑者服務中心</h1>
        <div class="en-subtitle">RUNNER SERVICE CENTER</div>
        <div class="cta-button">讓我們聽見您的腳步聲</div>
        <div class="copywriting">
            <p>無論您是因突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷。</p>
            <p>您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。</p>
            <p>讓我們一起朝更好的方向邁進，讓這份對跑步熱愛，連結起每一個熱血的靈魂。</p>
            <p>希望這裡不只是網站，更是跑者們的補給站。</p>
        </div>
        <div class="footer-info">
            服務時間：週一至週五 09:00-18:00<br>
            (跑者不休息，但小編需要一些運動時間)
        </div>
    </header>

    <div class="form-container">
        <div class="field">
            <label>姓名 / Name</label>
            <input type="text" class="small-input" placeholder="請輸入您的姓名">
        </div>
        <div class="field">
            <label>電子信箱 / E-mail</label>
            <input type="email" class="small-input" placeholder="runner@example.com">
        </div>
        <div class="field">
            <label>跑者屬性 / Runner Type</label>
            <select class="small-input" style="height:34px;">
                <option value="">請選擇 / Please Select</option>
                <option value="beginner">新手跑者 / Beginner Runner</option>
                <option value="half-marathon">半馬跑者 / Half Marathon Runner</option>
                <option value="marathon">全馬跑者 / Full Marathon Runner</option>
                <option value="ultra-trail">超馬/越野跑者 / Ultra & Trail Runner</option>
            </select>
        </div>
        <div class="field">
            <label>最佳成績 / Personal Best (PB)</label>
            <input type="text" class="small-input" placeholder="例如：全馬 3:30:00">
        </div>
        <div class="field">
            <label>目標成績 / Target Goal</label>
            <input type="text" class="small-input" placeholder="例如：全馬 2:59:59">
        </div>
        <div class="field">
            <label>穿戴配備 / Wearable Devices</label>
            <input type="text" class="small-input" placeholder="例如：Garmin, Apple Watch, Coros">
        </div>
        <div class="field">
            <label>您的問題 / Your Message</label>
            <textarea rows="5" placeholder="每一滴汗水，都值得被聽見..."></textarea>
        </div>
        <div class="field">
            <label>驗證碼 / Verification Code</label>
            <div class="captcha-group">
                <input type="text" class="captcha-input" placeholder="驗證碼">
                <div class="captcha-img" id="captcha">C 2 L 2</div>
                <span class="refresh-icon" onclick="refreshCaptcha()">↻</span>
            </div>
        </div>
        <button type="button" class="submit-btn" onclick="alert('表單已送出！')">送出表單 / Submit Form</button>
    </div>

    <script>
        function refreshCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length)) + ' ';
            }
            document.getElementById('captcha').innerText = code.trim();
        }
    </script>

</body>
</html>
