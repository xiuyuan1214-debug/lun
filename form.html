<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Service Center - Form</title>
    <style>
        body { margin: 0; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        /* 黑色導航欄位 - 參考 IMG_5377_7.jpeg */
        .header-nav { background-color: #222; padding: 25px 0 15px; text-align: center; }
        .nav-links a { color: #fff; text-decoration: none; margin: 0 10px; font-size: 14px; }

        /* 奶黃色操場圓弧頂部 - 參考 IMG_5557_6.jpg */
        .playground-header {
            background-color: #fcf6e3;
            border-bottom-left-radius: 50% 15%;
            border-bottom-right-radius: 50% 15%;
            padding: 50px 30px 40px;
            text-align: center;
            color: #8b7355;
        }
        .main-title { font-size: 26px; font-weight: bold; margin-bottom: 5px; }
        .sub-title { font-size: 12px; letter-spacing: 2px; margin-bottom: 20px; opacity: 0.8; }
        .badge { background: #fff; color: #d47a3c; padding: 8px 25px; border-radius: 25px; display: inline-block; font-weight: bold; margin-bottom: 20px; }
        .intro-text { font-size: 13px; line-height: 1.8; text-align: left; max-width: 450px; margin: 0 auto; color: #7a6e5d; }
        .service-info { margin-top: 20px; font-size: 12px; color: #b5a489; }

        /* 表單區域 - 參考 IMG_5552_6.jpg */
        .container { max-width: 480px; margin: 30px auto; padding: 0 20px 80px; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-size: 14px; font-weight: bold; color: #444; margin-bottom: 10px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; border: 1px solid #eeeeee; border-radius: 10px; background: #f9f9f9; box-sizing: border-box; font-size: 14px;
        }
        .submit-btn {
            background-color: #4e4439; color: white; width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header-nav">
        <div class="nav-links">
            <a href="index.html">教練資歷</a>
            <a href="courses.html">課程簡介</a>
            <a href="tools.html">配速工具</a>
            <a href="training.html">訓練日誌</a>
            <a href="match.html">賽事日誌</a>
        </div>
    </div>

    <div class="playground-header">
        <div class="main-title">跑者能量補給站</div>
        <div class="sub-title">RUNNERS' ENERGY STATION</div>
        <div class="badge">讓我們聽見您的腳步聲</div>
        <div class="intro-text">
            無論您是因突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷。<br><br>
            您的回饋是我們進化的動力，您的提問是我們探索的方向... 讓我們一起朝更好的方向邁進。
        </div>
        <div class="service-info">
            ☀️ 服務時間：週一至週五 09:00 - 18:00<br>
            (跑者不休息，但小編需要一些運動時間)
        </div>
    </div>

    <div class="container">
        <form>
            <div class="form-group">
                <label>姓名 / Name</label>
                <input type="text" placeholder="請輸入您的姓名">
            </div>
            <div class="form-group">
                <label>電子信箱 / E-mail</label>
                <input type="email" placeholder="runner@gmail.com">
            </div>
            <div class="form-group">
                <label>跑者屬性 / Runner Type</label>
                <select>
                    <option>請選擇 / Please Select</option>
                    <option>初階跑者 / Beginner</option>
                    <option>全馬跑者 / Marathoner</option>
                </select>
            </div>
            <div class="form-group">
                <label>最佳成績 / Personal Best</label>
                <input type="text" placeholder="例如：全馬3:30:00">
            </div>
            <div class="form-group">
                <label>目標成績 / Target Goal</label>
                <input type="text" placeholder="例如：全馬2:59:59">
            </div>
            <div class="form-group">
                <label>穿戴配備 / Wearable Device</label>
                <input type="text" placeholder="例如：Garmin, Apple Watch, Coros">
            </div>
            <div class="form-group">
                <label>您的問題 / Your Inquiry</label>
                <textarea rows="4" placeholder="每一滴汗水，都值得被聽見..."></textarea>
            </div>
            <button type="submit" class="submit-btn">送出表單 / Submit Form</button>
        </form>
    </div>
</body>
</html>
