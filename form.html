<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者服務中心 / Runner Service Center</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        /* 奶黃底操場格式 Header */
        .stadium-header {
            background-color: #FFFDD0; /* 奶黃底 */
            border: 2px solid #000;
            border-radius: 100px; /* 操場格式 */
            width: 90%;
            height: 150px;
            margin: 20px auto;
            position: relative;
            
            /* 執行指令：內部線條往上移至中心 */
            display: flex;
            align-items: center; 
            justify-content: center;
        }

        .inner-line {
            width: 85%;
            height: 1px;
            background-color: #000;
            position: absolute;
            /* 確保線條在奶黃底容器的絕對垂直中心 */
            top: 50%;
            transform: translateY(-50%);
        }

        .header-text {
            position: relative;
            z-index: 10;
            text-align: center;
            background-color: #FFFDD0;
            padding: 0 20px;
        }

        /* 導航功能區 */
        .nav-tools {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .nav-tools a {
            text-decoration: none;
            color: #000;
            font-weight: bold;
            border: 1px solid #000;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .form-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #000;
        }

        .captcha-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .captcha-input {
            width: 60px !important; /* 依照指令縮小寬度 */
        }

        .service-footer {
            text-align: center;
            margin: 40px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="stadium-header">
        <div class="inner-line"></div>
        <div class="header-text">
            <h1 style="margin:0;">跑者服務中心</h1>
            <p style="margin:0;">Runner Service Center</p>
        </div>
    </div>

    <div class="nav-tools">
        <a href="#">配速工具 / Pace Tool</a>
        <a href="#">賽事日誌 / Race Log</a>
        <a href="#">訓練日誌 / Training Log</a>
    </div>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label>姓名 / Name</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>電子信箱 / E-mail</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>跑者屬性 / Runner Attributes</label>
                <select>
                    <option>新手跑者</option>
                    <option>半馬跑者</option>
                    <option>全馬跑者</option>
                    <option>專業教練</option>
                </select>
            </div>

            <div class="form-group">
                <label>個人最佳成績 (PB) / Personal Best</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>目標挑戰 / Target Goal</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>穿戴裝置 / Wearable Device</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>諮詢內容 / Inquiry</label>
                <textarea rows="4"></textarea>
            </div>

            <div class="form-group">
                <label>驗證碼 / Verification Code</label>
                <div class="captcha-box">
                    <input type="text" class="captcha-input">
                    <span style="background:#ccc; padding:2px 10px;">8A2F</span>
                    <span style="cursor:pointer;">↻</span> <!-- 重新整理符號 -->
                </div>
            </div>

            <button type="submit" style="width:100%; padding:10px; background:#000; color:#fff; cursor:pointer;">送出諮詢 / Submit</button>
        </form>
    </div>

    <div class="service-footer">
        週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
    </div>

</body>
</html>
