<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>跑者服務中心</title>
    <style>
        /* 奶黃底操場格式 Header */
        .stadium-header {
            background-color: #FFFDD0; /* 奶黃底 */
            border-radius: 100px; /* 操場格式 */
            width: 100%;
            height: 100px;
            
            /* 執行指令：內部線條往上移置中 */
            display: flex;
            align-items: center; 
            justify-content: center;
        }

        /* 內部線條 */
        .inner-line {
            width: 80%;
            height: 1px;
            background-color: #000;
            margin: 0; 
        }

        /* 驗證碼框寬度 */
        .captcha-input {
            width: 60px;
        }
    </style>
</head>
<body>

    <div class="stadium-header">
        <div class="inner-line"></div>
    </div>

    <form>
        <div>
            <label>姓名 / Name</label>
            <input type="text">
        </div>
        <div>
            <label>電子信箱 / E-mail</label>
            <input type="email">
        </div>
        <div>
            <label>驗證碼 / Verification Code</label>
            <input type="text" class="captcha-input">
            <span>重新整理符號 ↻</span>
        </div>
    </form>

    <div>
        週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
    </div>

</body>
</html>
