<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者服務中心</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            background-color: #ffffff;
            color: #8D7353; /* 截圖中的深褐色字體 */
        }

        /* 頂部導覽列 */
        .nav-bar {
            background-color: #333;
            color: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            font-size: 14px;
        }

        /* 奶黃底操場格式容器 */
        .main-container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .stadium-header {
            background-color: #FFF9E7; /* 奶黃底 */
            border-radius: 120px; /* 呈現截圖中的大圓弧操場感 */
            padding: 40px 30px;
            text-align: center;
            position: relative;
            margin-bottom: 30px;
        }

        .title-main {
            font-size: 28px;
            font-weight: bold;
            color: #8D7353;
            margin: 0;
            letter-spacing: 2px;
        }

        .title-sub {
            font-size: 14px;
            letter-spacing: 4px;
            margin: 5px 0 20px 0;
            color: #C5B08A;
        }

        .highlight-btn {
            background-color: #ffffff;
            color: #D28B52;
            padding: 8px 25px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        /* 指令執行：內部細線往上移至中心 */
        .inner-line {
            width: 80%;
            height: 1px;
            background-color: #E8E0C5;
            margin: 10px auto; /* 置中 */
        }

        .description {
            font-size: 13px;
            line-height: 1.8;
            color: #8D7353;
            text-align: justify;
            margin: 15px 0;
        }

        .service-time-small {
            font-size: 10px;
            color: #C5B08A;
            margin-top: 10px;
        }

        /* 表單樣式復原 */
        .form-label {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border: 1px solid #F2F2F2;
            background-color: #F9F9F9;
            border-radius: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <div>教練資歷</div>
        <div>課程簡介</div>
        <div>配速工具</div>
        <div>訓練日誌</div>
        <div>賽事日誌</div>
    </div>

    <div class="main-container">
        <div class="stadium-header">
            <h1 class="title-main">跑者服務中心</h1>
            <p class="title-sub">RUNNER SERVICE CENTER</p>
            
            <div class="highlight-btn">讓我們聽見您的腳步聲</div>
            
            <!-- 執行指令：線條置中 -->
            <div class="inner-line"></div>

            <div class="description">
                無論您是因突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們唷。<br><br>
                您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。<br><br>
                讓我們一起朝更好的方向邁進，讓這份對跑步熱愛，連結每一個熱血的靈魂。<br><br>
                希望這裡不職是網站，更是跑者們的補給站。
            </div>

            <div class="service-time-small">
                服務時間：週一至週五 09:00-18:00<br>
                (跑者不休息，但小編需要一些運動時間)
            </div>
        </div>

        <label class="form-label">姓名 / Name</label>
        <input type="text" class="input-field" placeholder="請輸入您的姓名">

        <label class="form-label">電子信箱 / E-mail</label>
        <input type="text" class="input-field" placeholder="runner@example.com">

        <label class="form-label">跑者屬性 / Runner Type</label>
        <select class="input-field">
            <option>請選擇 (Please Select)</option>
        </select>
    </div>

</body>
</html>
