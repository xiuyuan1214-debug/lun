<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Service Center</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #ffffff; }
        
        /* 黑色導覽列：恢復連結功能 */
        .top-nav {
            background-color: #333333;
            padding: 15px 0;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }
        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
        }

        /* 奶黃色高拱型拋物線頁首 */
        .playground-header {
            background-color: #fcf6e3; 
            border-bottom-left-radius: 50% 20%; 
            border-bottom-right-radius: 50% 20%;
            padding: 60px 30px 90px 30px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .title { color: #8b7355; font-size: 26px; font-weight: bold; margin: 0; }
        .subtitle { color: #b5a442; font-size: 11px; margin: 5px 0 25px 0; }
        
        .cta-white {
            background-color: #ffffff;
            color: #d47a3c; 
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 30px;
        }

        .main-copy {
            font-size: 12.5px;
            line-height: 1.8;
            color: #666666;
            text-align: left;
        }

        /* 表單內容與配色 */
        .form-section { max-width: 500px; margin: 0 auto; padding: 40px 30px; }
        
        label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 10px; 
            color: #444444; 
            font-size: 15px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #eeeeee;
            border-radius: 12px;
            background-color: #f9f9f9;
            box-sizing: border-box;
        }

        /* 送出按鈕精準配色 */
        .submit-button {
            width: 100%;
            background-color: #554d44;
            color: #ffffff;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-link">教練資歷</a>
            <a href="courses.html" class="nav-link">課程簡介</a>
            <!-- 恢復頁面連結內容 -->
            <a href="pace_tool.html" class="nav-link">配速工具</a>
            <a href="training_log.html" class="nav-link">訓練日誌</a>
            <a href="race_log.html" class="nav-link">賽事日誌</a>
        </div>
    </nav>

    <div class="playground-header">
        <h1 class="title">跑者能量補給站</h1>
        <div class="subtitle">RUNNERS ENERGY STATION</div>
        <div class="cta-white">讓我們聽見您的腳步聲</div>
        <div class="main-copy">
            無論您是因突破個人最佳成績而興奮，亦或是正處於受傷低潮，有任何想回饋的想法，歡迎隨時聯繫我們。<br><br>
            您的回饋是我們進化的動力，您的提問是我們探索的方向，若您在訓練的路上遇到瓶頸，或者發現我們能做得更好的地方，請告訴我們。
        </div>
    </div>

    <div class="form-section">
        <label>姓名 / Name</label>
        <input type="text" placeholder="請輸入您的姓名">
        
        <label>電子信箱 / E-mail</label>
        <input type="email" placeholder="runner@gmail.com">

        <label>跑者屬性 / Runner Type</label>
        <select>
            <option>請選擇 / Please Select</option>
        </select>

        <!-- 恢復被遺漏的欄位 -->
        <label>最佳成績 / Personal Best</label>
        <input type="text" placeholder="例如：全馬3:30:00">

        <label>目標成績 / Target Goal</label>
        <input type="text" placeholder="例如：全馬2:59:59">

        <label>穿戴配備 / Wearable Device</label>
        <input type="text" placeholder="例如：Garmin, Apple Watch, Coros">

        <label>您的問題 / Your Inquiry</label>
        <textarea placeholder="每一滴汗水，都值得被聽見..."></textarea>

        <button class="submit-button">送出表單 / Submit Form</button>
    </div>

</body>
</html>
