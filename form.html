<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑者服務中心 / Runner Service Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
        }

        /* 奶黃底操場格式 Header */
        .stadium-header {
            background-color: #FFFDD0; /* 奶黃底 */
            border: 2px solid #000;
            border-radius: 100px; /* 操場格式 */
            width: 100%;
            height: 120px;
            margin: 0 auto 30px auto;
            position: relative;
            
            /* 指令執行：將內部線條往上移至置中 */
            display: flex;
            align-items: center; 
            justify-content: center;
        }

        /* 內部線條 */
        .inner-line {
            width: 90%;
            height: 1px;
            background-color: #000;
            z-index: 1;
        }

        /* 標題文字置於線條上方 */
        .header-title {
            position: absolute;
            background-color: #FFFDD0;
            padding: 0 15px;
            font-weight: bold;
            font-size: 1.5rem;
            z-index: 2;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* 驗證碼區塊調整 */
        .captcha-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .captcha-input {
            width: 80px !important; /* 依照指令縮小寬度 */
        }

        .refresh-symbol {
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        .service-time {
            margin-top: 40px;
            text-align: center;
            font-size: 14px;
            color: #333;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- 跑者服務中心 Header -->
    <div class="stadium-header">
        <div class="header-title">跑者服務中心 / Runner Service Center</div>
        <div class="inner-line"></div>
    </div>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label>姓名 / Name</label>
                <input type="text" placeholder="請輸入您的姓名">
            </div>

            <div class="form-group">
                <label>電子信箱 / E-mail</label>
                <input type="email" placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label>跑者屬性 / Runner Attributes</label>
                <select>
                    <option value="newbie">新手跑者</option>
                    <option value="half-marathon">半馬跑者</option>
                    <option value="full-marathon">全馬跑者</option>
                    <option value="coach">專業教練</option>
                </select>
            </div>

            <div class="form-group">
                <label>個人最佳成績 (PB) / Personal Best</label>
                <input type="text" placeholder="HH:MM:SS">
            </div>

            <div class="form-group">
                <label>目標挑戰 / Target Goal</label>
                <input type="text" placeholder="您下一個目標賽事或成績">
            </div>

            <div class="form-group">
                <label>穿戴裝置 / Wearable Device</label>
                <input type="text" placeholder="例如: Garmin, Apple Watch">
            </div>

            <div class="form-group">
                <label>諮詢內容 / Inquiry</label>
                <textarea rows="5" placeholder="請描述您的問題"></textarea>
            </div>

            <div class="form-group">
                <label>驗證碼 / Verification Code</label>
                <div class="captcha-container">
                    <input type="text" class="captcha-input">
                    <span style="background: #eee; padding: 5px 10px; border: 1px solid #999;">8A2F</span>
                    <span class="refresh-symbol">↻</span> <!-- 重新整理符號 -->
                </div>
            </div>

            <button type="submit">送出諮詢 / Submit</button>
        </form>

        <div class="service-time">
            週一至週五 09:00 - 18:00 (跑者不休息，但小編需要一些運動時間)
        </div>
    </div>

</body>
</html>
