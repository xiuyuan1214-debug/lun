<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配速工具</title>
    <style>
        :root {
            --soft-pink: #FFD1DC;
            --soft-blue: #B3E5FC;
            --text-color: #6D4C41;
            --bg-color: #FFF9FB;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 30px;
            margin: 0;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
        }

        /* 標題 (已刪除下方的黃色線條) */
        h1 {
            font-size: 36px;
            margin-bottom: 30px;
            font-weight: 900;
        }

        .sub-title {
            font-size: 22px;
            font-weight: bold;
            color: #FF80AB;
            margin-bottom: 25px;
            display: block;
        }

        .item-group {
            margin-bottom: 30px;
        }

        .label-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            display: block;
        }

        /* 輸入框：無預設數字、無多餘線條、圓潤活潑風格 */
        input {
            border: 3px solid var(--soft-pink);
            border-radius: 20px;
            padding: 12px;
            font-size: 18px;
            outline: none;
            background-color: white;
            transition: transform 0.2s;
        }

        input:focus {
            transform: scale(1.02);
            border-color: #FF80AB;
        }

        #distance { width: 100%; max-width: 300px; }
        .pace-min { width: 100px; text-align: center; }
        .pace-sec { width: 100px; text-align: center; }

        .unit {
            font-size: 20px;
            font-weight: bold;
            margin-left: 10px;
            color: #BA68C8;
        }

        /* 顯示框：活潑氣泡感 */
        .display-box {
            background-color: white;
            border: 3px dashed var(--soft-blue);
            border-radius: 25px;
            padding: 20px;
            width: 260px;
            font-size: 26px;
            font-family: 'Courier New', monospace;
            color: #039BE5;
            text-align: center;
            margin-top: 10px;
            box-shadow: 5px 5px 0px var(--soft-blue);
        }

        /* 按鈕：可愛Q彈風格 */
        .btn-calc {
            background: linear-gradient(135deg, #FF80AB, #FF4081);
            border: none;
            border-radius: 50px;
            padding: 15px 50px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #C2185B;
            margin: 20px 0;
            transition: all 0.1s;
        }

        .btn-calc:hover {
            filter: brightness(1.1);
        }

        .btn-calc:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #C2185B;
        }

        br { margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>配速工具</h1>

    <span class="sub-title">跑步完賽時間預測</span>

    <div class="item-group">
        <label class="label-name">距離</label>
        <input type="number" id="distance" placeholder="">
        <span class="unit">km</span>
    </div>

    <div class="item-group">
        <label class="label-name">配速</label>
        <input type="number" id="paceMin" class="pace-min" placeholder="">
        <span class="unit">'</span>
        <br>
        <input type="number" id="paceSec" class="pace-sec" placeholder="">
        <span class="unit">"</span>
    </div>

    <div class="item-group">
        <label class="label-name">時間：</label>
        <div id="timeDisplay" class="display-box">-- : -- : --</div>
    </div>

    <button class="btn-calc" onclick="runCalc()">計算</button>

    <div class="item-group">
        <label class="label-name">預估完賽時間：</label>
        <div id="resultDisplay" class="display-box">-- : -- : --</div>
    </div>
</div>

<script>
    function runCalc() {
        const d = parseFloat(document.getElementById('distance').value);
        const m = parseInt(document.getElementById('paceMin').value) || 0;
        const s = parseInt(document.getElementById('paceSec').value) || 0;

        if (d > 0 && (m > 0 || s > 0)) {
            let totalSeconds = (m * 60 + s) * d;
            let hrs = Math.floor(totalSeconds / 3600);
            let mins = Math.floor((totalSeconds % 3600) / 60);
            let secs = Math.round(totalSeconds % 60);

            const pad = (v) => v.toString().padStart(2, '0');
            const finalStr = `${pad(hrs)} : ${pad(mins)} : ${pad(secs)}`;
            
            document.getElementById('timeDisplay').innerText = finalStr;
            document.getElementById('resultDisplay').innerText = finalStr;
        } else {
            alert("請輸入距離與配速喔！🍭");
        }
    }
</script>

</body>
</html>
