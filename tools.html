<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配速工具</title>
    <style>
        :root {
            --main-yellow: #FFD54F;
            --soft-bg: #FFF9F0;
            --text-dark: #4E342E;
            --accent-pink: #FFAB91;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--soft-bg);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            border: 6px solid #FFF176;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        .title-underline {
            width: 60px;
            height: 6px;
            background-color: var(--main-yellow);
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            display: block;
        }

        .label-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0 10px 0;
            display: block;
        }

        /* 輸入框樣式 */
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        input {
            border: 2px solid #EEE;
            border-radius: 15px;
            padding: 10px;
            font-size: 1rem;
            outline: none;
            background: #FAFAFA;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--main-yellow);
            background: #FFF;
        }

        #distance { width: 80%; }
        .pace
