<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找尋你の專屬步調</title>
    <style>
        :root {
            --bg-muted: #F5F2ED;      /* 莫蘭迪米色 */
            --border-soft: #D7CCC8;   /* 柔和棕 */
            --text-main: #4E342E;     /* 深褐 */
            --accent-muted: #8D6E63;  /* 霧面棕 */
            --nav-bg: #222222;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-muted);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 導覽列設計 */
        .nav-bar {
            width: 100%;
            background-color: var(--nav-bg);
            display: flex;
            justify-content: center;
            padding: 0;
        }

        .nav-item {
            flex: 1;
            max-width: 120px;
            text-align: center;
            padding: 12px 0;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .nav-item.active {
            background-color: var(--accent-muted);
        }

        /* 內容區：間距縮小 */
        .content-container {
            width: 90%;
            max-width: 350px;
            padding: 20px 10px;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 15px 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            display: block;
        }

        .label-text {
            font-size: 16px;
            font-weight: bold;
            margin: 12px 0 8px 0;
            display: block;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 框件縮小 */
        input {
            width: 65px;
            padding: 8px;
            border: 1.5px solid var(--border-soft);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            text-align: center;
            background-color: white;
        }

        .colon {
            font-size: 20px;
            color: var(--accent-muted);
        }

        .unit {
            font-size: 16px;
        }

        /* 顯示框縮小 */
        .display-box {
            background-color: #EFEBE9;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 10px;
            width: 180px;
            font-size: 20px;
            color: var(--text-main);
            font-family: monospace;
            text-align: center;
            min-height: 24px;
        }

        /* 計算按鈕縮小 */
        .btn-calc {
            background-color: var(--accent-muted);
            border: none;
            border-radius: 20px;
            padding: 10px 40px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 20px 0;
        }

        .btn-calc:active {
            transform: scale(0.98);
        }

        /* 底部文字間距縮小 */
        .footer-quote {
            margin-top: 30px;
            font-size: 13px;
            color: #795548;
            line-height: 1.5;
            border-left: 2px solid var(--accent-muted);
            padding-left: 10px;
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <a href="courses.html" class="nav-item">課程簡介</a>
        <a href="tools.html" class="nav-item active">配速工具</a>
        <a href="match.html" class="nav-item">賽事日誌</a>
        <a href="training.html" class="nav-item">訓練日誌</a>
        <a href="resume.html" class="nav-item">教練簡歷</a>
    </nav>

    <div class="content-container">
        <h1>找尋你の專屬步調</h1>
        <span class="section-title">跑步完賽時間預測</span>

        <label class="label-text">距離</label>
        <div class="input-row">
            <input type="number" id="distance">
            <span class="unit">km</span>
        </div>

        <label class="label-text">配速</label>
        <div class="input-row">
            <input type="number" id="paceMin">
            <span class="colon">:</span>
            <input type="number" id="paceSec">
        </div>

        <label class="label-text">時間：</label>
        <div id="timeDisplay" class="display-box"></div>

        <button class="btn-calc" onclick="runCalc()">計算</button>

        <label class="label-text">預估完賽時間：</label>
        <div id="resultDisplay" class="display-box"></div>

        <div class="footer-quote">
            讓每一滴汗水，都精確地匯聚成通往終點の軌跡
        </div>
    </div>

<script>
    function runCalc() {
        const d = parseFloat(document.getElementById('distance').value);
        const m = parseInt(document.getElementById('paceMin').value) || 0;
        const s = parseInt(document.getElementById('paceSec').value) || 0;

        if (d > 0 && (m > 0 || s > 0)) {
            let totalSeconds = (m * 60 + s) * d;
            let hrs = Math.floor(totalSeconds / 3600);
            let mins = Math.floor((totalSeconds % 3600) / 60);
            let secs = Math.round(totalSeconds % 60);

            const pad = (v) => v.toString().padStart(2, '0');
            const resultStr = `${pad(hrs)} : ${pad(mins)} : ${pad(secs)}`;
            
            document.getElementById('timeDisplay').innerText = resultStr;
            document.getElementById('resultDisplay').innerText = resultStr;
        }
    }
</script>

</body>
</html>
