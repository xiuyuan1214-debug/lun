<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配速工具 - 溫馨版</title>
    <style>
        :root {
            --primary-color: #FFB347; /* 暖橘色 */
            --bg-color: #FFF9E1;      /* 奶油黃 */
            --card-bg: #FFFFFF;
            --text-color: #5A4A42;    /* 深可可色，比純黑更溫馨 */
            --input-border: #E0E0E0;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            width: 320px;
            text-align: center;
            border: 4px solid #FFEBB7;
        }

        h2 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .decoration-line {
            width: 50px;
            height: 5px;
            background: var(--primary-color);
            margin: 0 auto 1.5rem;
            border-radius: 10px;
        }

        .subtitle {
            font-weight: bold;
            margin-bottom: 1rem;
            display: block;
        }

        .input-section {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 15px;
            border: 2px solid var(--input-border);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background-color: #FAFAFA;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        .pace-inputs input {
            width: 60px;
            text-align: center;
        }

        .unit {
            font-weight: bold;
            color: #A0A0A0;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 50px;
            background-color: var(--primary-color);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #E69526;
            transition: all 0.1s;
            margin-bottom: 1.5rem;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #E69526;
        }

        .result-container {
            background-color: #FFF3E0;
            padding: 15px;
            border-radius: 20px;
        }

        .result-label {
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #B08968;
        }

        .result-value {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            font-weight: bold;
            color: #D35400;
            letter-spacing: 2px;
        }

        .icon { margin-right: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>配速工具</h2>
    <div class="decoration-line"></div>
    
    <span class="subtitle">跑步完賽時間預測 ✨</span>

    <div class="input-section">
        <label><span class="icon">🏃</span>距離</label>
        <div class="input-row">
            <input type="number" id="distance" value="10" step="0.1">
            <span class="unit">km</span>
        </div>

        <label><span class="icon">⏱️</span>配速</label>
        <div class="input-row pace-inputs">
            <input type="number" id="paceMin" value="4">
            <span class="unit">'</span>
