<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找尋你の專屬步調</title>
    <style>
        :root {
            --warm-orange: #FFB74D;
            --warm-cream: #FFF9F0;
            --text-brown: #5D4037;
            --accent-yellow: #FFE082;
            --box-bg: #FFFFFF;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--warm-cream);
            color: var(--text-brown);
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        /* 標題：改為指定文字，無黃線 */
        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            text-align: left;
            font-weight: bold;
        }

        .sub-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            display: block;
        }

        .item-group {
            margin-bottom: 25px;
        }

        .label-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            display: block;
        }

        /* 輸入框控制：距離與配速大小一致，無數字 */
        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input {
            width: 80px; /* 統一輸入框大小 */
            border: 2px solid var(--warm-orange);
            border-radius: 12px;
            padding: 10px;
            font-size: 18px;
            outline: none;
            background-color: var(--box-bg);
            text-align: center;
            color: var(--text-brown);
        }

        input:focus {
            background-color: #FFFDE7;
        }

        .unit {
            font-size: 18px;
            font-weight: bold;
        }

        /* 顯示框：溫暖活潑感 */
        .display-box {
            background-color: var(--box-bg);
            border: 2px solid var(--accent-yellow);
            border-radius: 15px;
            padding: 15px;
            width: 220px;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            color: #E65100;
            text-align: center;
            margin-top: 5px;
            box-shadow: 3px 3px 0px var(--accent-yellow);
        }

        /* 按鈕：溫暖配色 Q 彈感 */
        .btn-calc {
            background-color: var(--warm-orange);
            border: none;
            border-radius: 25px;
            padding: 12px 50px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0 #EF6C00;
            margin: 25px 0;
            transition: all 0.1s;
        }

        .btn-calc:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #EF6C00;
        }

        /* 最底層文字 */
        .footer-text {
            margin-top: 40px;
            font-size: 14px;
            color: #8D6E63;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>找尋你の專屬步調</h1>

    <span class="sub-title">跑步完賽時間預測</span>

    <div class="item-group">
        <label class="label-name">距離</label>
        <div class="input-row">
            <input type="number" id="distance">
            <span class="unit">km</span>
        </div>
    </div>
