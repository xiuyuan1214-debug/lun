<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找尋你の專屬步調</title>
    <style>
        :root {
            --warm-bg: #FFFDF9;
            --main-warm-orange: #FFB300;
            --secondary-warm: #FFE082;
            --text-color: #5D4037;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--warm-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 30px 0;
        }

        .sub-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            display: block;
        }

        .label-text {
            font-size: 20px;
            margin-bottom: 15px;
            display: block;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            width: 80px; /* 距離與配速輸入框寬度一致 */
            padding: 10px;
            border: 2.5px solid var(--main-warm-orange);
            border-radius: 15px;
            font-size: 18px;
            outline: none;
            background: white;
            text-align: center;
        }

        .unit {
            font-size: 20px;
            font-weight: bold;
        }

        .display-box {
            background-color: #FFFFFF;
            border: 2px solid var(--secondary-warm);
            border-radius: 12px;
            padding: 15px;
            width: 250px;
            font-size: 24px;
            color: #EF6C00;
            font-family: monospace;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--main-warm-orange);
            border: none;
            border-radius: 30px;
            padding: 12px 60px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0 #E65100;
            margin: 20px 0;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #E65100;
        }

        .footer-text {
            margin-top: 50px;
            font-size: 14px;
            color: #A1887F;
            text-align: left;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>找尋你の專屬步調</h1>

    <span class="sub-title">跑步完賽時間預測</span>

    <label class="label-text">距離</label>
    <div class="input-row">
        <input type="number" id="distance">
        <span class="unit">km</span>
    </div>

    <label class="label-text">配速</label>
    <div class="input-row">
        <input type="number" id="paceMin">
        <input type="number" id="paceSec">
    </div>

    <label class="label-text">時間：</label>
    <div id="timeDisplay" class="display-box">-- : -- : --</div>

    <button onclick="calculate()">計算</button>

    <label class="label-text">預估完賽時間：</label>
    <div id="resultDisplay" class="display-box">-- : -- : --</div>

    <div class="footer-text">
        讓每一滴汗水，都精確地匯聚成通往終點の軌跡
    </div>
</div>

<script>
    function calculate() {
        const d = parseFloat(document.getElementById('distance').value);
        const m = parseInt(document.getElementById('paceMin').value) || 0;
        const s = parseInt(document.getElementById('paceSec').value) || 0;

        if (d > 0 && (m > 0 || s > 0)) {
            let totalSec = (m * 60 + s) * d;
            let hrs = Math.floor(totalSec / 3600);
            let mins = Math.floor((totalSec % 3600) / 60);
            let secs = Math.round(totalSec % 60);

            const pad = (v) => v.toString().padStart(2, '0');
            const result = `${pad(hrs)} : ${pad(mins)} : ${pad(secs)}`;
            
            document.getElementById('timeDisplay').innerText = result;
            document.getElementById('resultDisplay').innerText = result;
        }
    }
</script>

</body>
</html>
