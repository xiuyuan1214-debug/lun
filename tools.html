<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找尋你の專屬步調</title>
    <style>
        :root {
            --warm-sun: #FF8F00;      /* 暖陽橘 */
            --cream-bg: #FFFBF2;      /* 奶油底色 */
            --soft-yellow: #FFF176;   /* 柔光黃 */
            --text-mocha: #4E342E;    /* 咖啡棕 */
            --white: #FFFFFF;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--cream-bg);
            color: var(--text-mocha);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 最上層導覽按鈕 */
        .nav-container {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background-color: var(--white);
            border: 2px solid var(--soft-yellow);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-mocha);
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .nav-btn:hover {
            background-color: var(--soft-yellow);
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background-color: var(--warm-sun);
            color: white;
            border-color: var(--warm-sun);
        }

        /* 主要內容區 */
        .main-wrapper {
            width: 90%;
            max-width: 400px;
            padding: 20px;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 10px 0;
            font-weight: bold;
        }

        .sub-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
            display: block;
        }

        .label-text {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0 12px 0;
            display: block;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input {
            width: 80px; /* 統一縮小輸入框 */
            padding: 12px;
            border: 2.5px solid var(--soft-yellow);
            border-radius: 15px;
            font-size: 18px;
            outline: none;
            text-align: center;
            color: var(--text-mocha);
            background-color: var(--white);
        }

        input:focus {
            border-color: var(--warm-sun);
        }

        .colon {
            font-size: 24px;
            font-weight: bold;
            color: var(--warm-sun);
        }

        .unit {
            font-size: 20px;
            font-weight: bold;
        }

        /* 顯示框 */
        .display-box {
            background-color: var(--white);
            border: 2px dashed
